name: Contract Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install test dependencies
        run: python -m pip install --require-hashes --requirement requirements-test.lock
      - name: Audit test dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-test.lock
      - name: Smoke-test runtime imports
        run: |
          python -c "from tools.argus_runtime import Argus, AnalysisEnvelope"
          python -c "import tools.atlas_sync"
          python -c "import tools.collection_sync"
      - name: Smoke-test command tools
        run: |
          python -m tools.live_smoke --help
          python -m tools.cross_repo_e2e --help
      - name: Run contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test deterministic package build
        run: python tools/package/build_release.py . dist
      - name: Upload deterministic main snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: argus-intelligence-main-snapshot
          path: |
            dist/argus-intelligence-*.zip
            dist/argus-intelligence-*.tar.gz
            dist/argus-intelligence-*.manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
