name: ARGUS ChatGPT Plugin Package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'plugin.json'
      - 'skills/argus-intelligence/**'
      - 'skills/argus-opportunity-intelligence/**'
      - 'skills/argus-ecosystem-intelligence/**'
      - 'skills/argus-procurement-market-intelligence/**'
      - 'skills/argus-monitoring-revalidation/**'
      - 'spec/persistence.yaml'
      - 'spec/mission-skill-routing.yaml'
      - 'schemas/mission-skill-plan.schema.json'
      - '.github/workflows/chatgpt-plugin-package.yml'
      - 'tests/test_chatgpt_plugin_package.py'
      - 'tests/test_modular_skill_pilots.py'
      - 'tests/scenarios/modular-skill-pilots.json'
  push:
    branches: [main]
    paths:
      - 'plugin.json'
      - 'skills/argus-intelligence/**'
      - 'skills/argus-opportunity-intelligence/**'
      - 'skills/argus-ecosystem-intelligence/**'
      - 'skills/argus-procurement-market-intelligence/**'
      - 'skills/argus-monitoring-revalidation/**'
      - 'spec/persistence.yaml'
      - 'spec/mission-skill-routing.yaml'
      - 'schemas/mission-skill-plan.schema.json'
      - '.github/workflows/chatgpt-plugin-package.yml'
      - 'tests/test_chatgpt_plugin_package.py'
      - 'tests/test_modular_skill_pilots.py'
      - 'tests/scenarios/modular-skill-pilots.json'

permissions:
  contents: read

jobs:
  package-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate plugin package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('plugin.json').read_text(encoding='utf-8'))
          assert manifest['$schema'] == 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json'
          assert manifest['name'] == 'argus-intelligence'
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', manifest['version'])
          skill = Path('skills/argus-intelligence/SKILL.md').read_text(encoding='utf-8')
          assert skill.startswith('---\nname: argus-intelligence\n')
          persistence = Path('spec/persistence.yaml').read_text(encoding='utf-8')
          assert 'id: argus.sharepoint-persistence' in persistence
          routing = Path('spec/mission-skill-routing.yaml').read_text(encoding='utf-8')
          assert 'next_step_authority: ATLAS' in routing
          schema = json.loads(Path('schemas/mission-skill-plan.schema.json').read_text(encoding='utf-8'))
          assert schema['title'] == 'ARGUS Mission Skill Plan'
          short = manifest['extensions']['com.openai']['interface']['shortDescription']
          assert len(short) <= 30
          print(f"Validated ARGUS plugin {manifest['version']}")
          PY
      - name: Validate synchronization workflow contract
        run: python3 -m unittest tests.test_chatgpt_plugin_package -v
      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/plugin-package
          mkdir -p dist/plugin-package/argus-intelligence/skills
          mkdir -p dist/plugin-package/argus-intelligence/spec
          mkdir -p dist/plugin-package/argus-intelligence/schemas
          cp plugin.json dist/plugin-package/argus-intelligence/plugin.json
          cp -R skills/argus-intelligence dist/plugin-package/argus-intelligence/skills/argus-intelligence
          cp -R skills/argus-opportunity-intelligence dist/plugin-package/argus-intelligence/skills/argus-opportunity-intelligence
          cp -R skills/argus-ecosystem-intelligence dist/plugin-package/argus-intelligence/skills/argus-ecosystem-intelligence
          cp -R skills/argus-procurement-market-intelligence dist/plugin-package/argus-intelligence/skills/argus-procurement-market-intelligence
          cp -R skills/argus-monitoring-revalidation dist/plugin-package/argus-intelligence/skills/argus-monitoring-revalidation
          cp spec/persistence.yaml dist/plugin-package/argus-intelligence/spec/persistence.yaml
          cp spec/mission-skill-routing.yaml dist/plugin-package/argus-intelligence/spec/mission-skill-routing.yaml
          cp schemas/mission-skill-plan.schema.json dist/plugin-package/argus-intelligence/schemas/mission-skill-plan.schema.json
          cd dist/plugin-package
          zip -qr ../argus-intelligence-chatgpt-plugin.zip argus-intelligence
      - name: Build synchronization request
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('plugin.json').read_text(encoding='utf-8'))
          wrapper_paths = [
              'plugin.json',
              'skills/argus-intelligence/SKILL.md',
              'skills/argus-intelligence/references/mission-routing.md',
              'skills/argus-intelligence/references/untrusted-source-boundary.md',
              'skills/argus-opportunity-intelligence/SKILL.md',
              'skills/argus-ecosystem-intelligence/SKILL.md',
              'skills/argus-procurement-market-intelligence/SKILL.md',
              'skills/argus-monitoring-revalidation/SKILL.md',
              'spec/persistence.yaml',
              'spec/mission-skill-routing.yaml',
              'schemas/mission-skill-plan.schema.json',
          ]
          request = {
              'schema_version': '1.0.0',
              'event_type': 'chatgpt_plugin_sync_required',
              'plugin': {
                  'name': manifest['name'],
                  'version': manifest['version'],
              },
              'source': {
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'commit': os.environ['SOURCE_COMMIT'],
                  'run_id': os.environ['GITHUB_RUN_ID'],
              },
              'artifact': {
                  'name': 'argus-intelligence-chatgpt-plugin',
                  'archive': 'argus-intelligence-chatgpt-plugin.zip',
              },
              'wrapper': {
                  'hash_algorithm': 'sha256',
                  'sha256': {
                      path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                      for path in wrapper_paths
                  },
              },
              'publication': {
                  'automatic': False,
                  'mechanism': 'plugin_creator_guarded_update',
                  'require_current_release_id': True,
                  'artifact_only_publication_input': True,
                  'publication_receipt_required': True,
              },
          }
          Path('dist/plugin-sync-request.json').write_text(
              json.dumps(request, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(request, sort_keys=True))
          PY
      - name: Upload plugin package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: argus-intelligence-chatgpt-plugin
          path: |
            dist/argus-intelligence-chatgpt-plugin.zip
            dist/plugin-sync-request.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  plugin-sync-handoff:
    needs: package-plugin
    if: github.event_name == 'push' && needs.package-plugin.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Emit repository synchronization event
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > sync-dispatch.json
          import json
          import os
          payload = {
              'event_type': 'chatgpt_plugin_sync_required',
              'client_payload': {
                  'plugin': 'argus-intelligence',
                  'source_commit': os.environ['SOURCE_COMMIT'],
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'artifact_name': 'argus-intelligence-chatgpt-plugin',
                  'sync_request': 'plugin-sync-request.json',
              },
          }
          print(json.dumps(payload))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input sync-dispatch.json
