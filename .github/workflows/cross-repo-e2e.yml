name: Cross-repository E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'argus-intelligence.yaml'
      - 'contracts/atlas/**'
      - 'schemas/atlas-argus-sync-receipt.schema.json'
      - 'tools/atlas_sync.py'
      - 'tools/argus_runtime.py'
      - 'tools/cross_repo_e2e.py'
      - 'tests/cross_repo/**'
      - '.github/workflows/cross-repo-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'argus-intelligence.yaml'
      - 'contracts/atlas/**'
      - 'schemas/atlas-argus-sync-receipt.schema.json'
      - 'tools/atlas_sync.py'
      - 'tools/argus_runtime.py'
      - 'tools/cross_repo_e2e.py'
      - 'tests/cross_repo/**'
      - '.github/workflows/cross-repo-e2e.yml'

permissions:
  contents: read

jobs:
  cross-repository-e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ARGUS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: argus-intelligence
          persist-credentials: false
      - name: Checkout compatible ATLAS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: gferris418/atlas-os
          ref: b8b8559c57eef5fbb97d914d924077ba20b1883d
          path: atlas-os
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: argus-intelligence/requirements-test.lock
      - name: Install dependencies
        working-directory: argus-intelligence
        run: python -m pip install --require-hashes --requirement requirements-test.lock
      - name: Run the real producer-consumer-return path
        working-directory: argus-intelligence
        run: python -m unittest discover -s tests/cross_repo -v
