name: Cross-repository E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'argus-intelligence.yaml'
      - 'alignments/atlas-os-triage-v2.yaml'
      - 'contracts/atlas/current-integration.yaml'
      - 'contracts/atlas/plugin-release-impact.yaml'
      - 'tools/atlas_v3_provider.py'
      - 'tools/cross_repo_e2e.py'
      - 'tests/cross_repo/**'
      - 'tests/test_cross_repo_command.py'
      - 'tests/test_plugin_release_impact_contract.py'
      - '.github/workflows/cross-repo-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'argus-intelligence.yaml'
      - 'alignments/atlas-os-triage-v2.yaml'
      - 'contracts/atlas/current-integration.yaml'
      - 'contracts/atlas/plugin-release-impact.yaml'
      - 'tools/atlas_v3_provider.py'
      - 'tools/cross_repo_e2e.py'
      - 'tests/cross_repo/**'
      - 'tests/test_cross_repo_command.py'
      - 'tests/test_plugin_release_impact_contract.py'
      - '.github/workflows/cross-repo-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross-repository-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout ARGUS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: argus-intelligence
          persist-credentials: false
      - name: Checkout compatible ATLAS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: gferris418/atlas-os
          ref: 95e78eb4f386c7434193014811ef8d2ce5254c30
          path: atlas-os
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: argus-intelligence/requirements-test.lock
      - name: Install dependencies
        working-directory: argus-intelligence
        run: python -m pip install --require-hashes --requirement requirements-test.lock
      - name: Smoke-test cross-repository command
        working-directory: argus-intelligence
        run: python -m tools.cross_repo_e2e --help
      - name: Run the current ATLAS provider-return path
        working-directory: argus-intelligence
        run: python -m unittest discover -s tests/cross_repo -v
