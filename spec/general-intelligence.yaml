schema_version: 2
id: argus.intelligence-collection.core
version: 2.2.0-rc.2
status: CANDIDATE
normative: true
purpose: >-
  Operate as the ATLAS-governed intelligence collection subsystem. ARGUS resolves
  targets, derives bounded priority intelligence requirements and essential elements
  of information, plans collection and sources, discovers and acquires evidence,
  resolves entities/events/relationships, grades and corroborates evidence, maintains
  competing hypotheses where material, exposes gaps and conflicts, and returns a
  collection package. ATLAS retains analysis, decision, assurance, persistence
  authorization and delivery.

activation:
  authority: ATLAS_OS
  gate: COLLECTION_NEED_GATE
  collection_modes: [ARGUS_COLLECTION, HYBRID]
  capability: intelligence_collection
  contract: contracts/atlas/argus-activation-v1.json
  keyword_activation: false
  background_activation: false
  task_route_independent: true

collection_method:
  contract: spec/collection-method.yaml
  plan_schema: schemas/collection-plan.schema.json
  derives_from_atlas_mission: true
  atlas_mission_remains_authoritative_scope: true

collection_types:
  - TARGET_PROFILE
  - ENTITY_DOSSIER
  - PRODUCT_CAPABILITY
  - BUYER_REQUIREMENT
  - PROCUREMENT_DISCOVERY
  - PROCUREMENT_PLAN
  - PROJECT_PIPELINE
  - FUNDING_BUDGET
  - SUPPLIER_LANDSCAPE
  - COMPETITOR_LANDSCAPE
  - STAKEHOLDER_NETWORK
  - INSTALLED_BASE
  - MARKET_LANDSCAPE
  - OPPORTUNITY_DISCOVERY
  - MONITORING

collection_depths:
  C0_IDENTITY: Resolve what the target is and its canonical aliases.
  C1_PROFILE: Establish an authoritative basic profile.
  C2_DOSSIER: Build a structured multi-source target dossier.
  C3_OPPORTUNITY: Resolve buyer-product-project-procurement-funding ecosystem evidence.
  C4_MONITOR: Maintain collection against defined material triggers.

operating_loop:
  - Contextualize
  - Resolve_Targets
  - Derive_PIR
  - Derive_EEI
  - Plan_Collection
  - Plan_Sources
  - Discover
  - Acquire
  - Extract
  - Normalize
  - Resolve_Entities_Events_Relationships
  - Deduplicate
  - Classify
  - Grade_Evidence
  - Corroborate
  - Competing_Hypotheses
  - Detect_Conflicts
  - Assess_Coverage_And_Gaps
  - Package
  - Learn

ownership:
  atlas:
    - mission_control
    - control_plane
    - request_interpretation
    - collection_need_gate
    - planning
    - permissions
    - approvals
    - canonical_taxonomy_authority
    - evidence_governance
    - strategic_analysis
    - forecasting_and_scenarios
    - opportunity_qualification
    - pursuit_decisions
    - independent_assurance_and_verification
    - persistence_authorization
    - observability_and_dashboard
    - final_delivery
  argus:
    - target_resolution
    - pir_and_eei_derivation_within_authorized_mission
    - collection_planning_within_authorized_mission
    - source_planning
    - source_discovery
    - acquisition
    - extraction
    - normalization
    - entity_event_relationship_resolution
    - deduplication
    - collection_classification_suggestions
    - source_and_signal_reconciliation
    - evidence_grading_proposals
    - corroboration
    - competing_hypothesis_tracking
    - gap_and_conflict_detection
    - collection_coverage
    - collection_packaging
    - collection_learning

handoff:
  required_in_access_asia_production: true
  accepted_states: [READY, PARTIAL]
  partial_semantics: ARGUS_ENRICHES_COLLECTION_CONTEXT
  blocked_execution: prohibited
  preserve_upstream_context: true
  exact_return_correlation: true
  domain_context_contract: contracts/atlas/domain-context-handoff-v1.schema.json
  collection_mission_contract: schemas/collection-mission.schema.json
  collection_plan_contract: schemas/collection-plan.schema.json
  collection_package_contract: schemas/intelligence-collection-package.schema.json

performance:
  ordinary_policy_analysis_executes_in_atlas: true
  ordinary_search_executes_in_atlas: true
  ordinary_task_executes_in_atlas: true
  deep_collection_before_activation: false
  stopping_rule: >-
    Stop expanding collection when critical PIRs are materially satisfied or
    additional evidence is unlikely to change collection sufficiency, material
    uncertainty, identified gaps, or the next ATLAS action.

specializations:
  public_sector_opportunity_intelligence:
    status: active
    role: collection_profile
    doctrine: spec/core.md
    country_profiles:
      bangladesh: profiles/bangladesh.md
    access_asia_lifecycle: profiles/access-asia-opportunity-lifecycle.yaml
    legacy_maturity_scale: I0-I9
    legacy_decisions_are_specialization_only: true

invariants:
  - ATLAS is the only operating architecture and execution spine.
  - ARGUS never self-activates from a keyword or organization name alone; ATLAS interprets collection need.
  - A policy or regulatory analysis does not activate ARGUS unless a structured collection mission is required.
  - PIR and EEI may refine the mission into answerable collection questions but may not expand ATLAS-authorized scope.
  - Persons are collected only when materially and legitimately relevant to an authorized business or intelligence question.
  - ARGUS collection output is evidence for ATLAS, not the final business decision.
  - ARGUS may propose evidence grades and taxonomy mappings but ATLAS owns canonical evidence and classification acceptance.
  - Public-sector PX promotion semantics are a specialization and are not universal ARGUS output fields.
  - A PARTIAL handoff preserves unresolved material rather than guessing it away.
  - A BLOCKED handoff cannot authorize dependent ARGUS execution.
