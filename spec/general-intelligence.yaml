schema_version: 3
id: argus.intelligence-collection.core
version: 3.0.0-rc.2
status: CANDIDATE
normative: true
purpose: >-
  Operate as the ATLAS-governed 360-degree Business Intelligence playbook for Access Asia,
  with government commercial opportunity intelligence as the primary specialization.
  ARGUS resolves targets; derives bounded PIR/EEI; collects and reconciles evidence;
  maintains persistent early commercial opportunity identity; tracks the government
  need-to-delivery lifecycle; builds international supplier universes; assesses supplier
  partnerability; matches demand and supply; computes advisory opportunity qualification;
  develops materially relevant stakeholder, competitor, market, post-award and commercial-
  performance intelligence; monitors material events; calibrates prior intelligence against
  outcomes; and returns an evidence-backed collection package to ATLAS. ATLAS retains the
  operating framework, routing, approvals, capability/provider selection and authorization,
  canonical evidence acceptance, authoritative commercial priority, pursuit decisions,
  persistence authorization, observability, verification and final delivery.

activation:
  authority: ATLAS
  mechanism: ROUTE
  route_mechanisms: [ARGUS, MULTI_CAPABILITY]
  capability: intelligence_collection
  provider: argus
  provider_field_semantics: compatibility_execution_handle_not_underlying_tool_provider
  approval_key: ARGUS_ACTIVATION
  explicit_user_approval_required: true
  contract: contracts/atlas/argus-activation-v1.json
  current_integration: contracts/atlas/current-integration.yaml
  keyword_activation: false
  background_activation: false

collection_method:
  contract: spec/collection-method.yaml
  plan_schema: schemas/collection-plan.schema.json
  business_intelligence_boundary: spec/business-intelligence-boundary.yaml
  commercial_opportunity_doctrine: spec/commercial-opportunity-intelligence.yaml
  derives_from_atlas_mission: true
  atlas_mission_remains_authoritative_scope: true
  provider_selection_authority: ATLAS

collection_types:
  - TARGET_PROFILE
  - ENTITY_DOSSIER
  - PRODUCT_CAPABILITY
  - BUYER_REQUIREMENT
  - PROCUREMENT_DISCOVERY
  - PROCUREMENT_PLAN
  - PROJECT_PIPELINE
  - FUNDING_BUDGET
  - SUPPLIER_LANDSCAPE
  - COMPETITOR_LANDSCAPE
  - STAKEHOLDER_NETWORK
  - INSTALLED_BASE
  - MARKET_LANDSCAPE
  - OPPORTUNITY_DISCOVERY
  - MONITORING
  - NEED_GAP
  - POLICY_DRIVER
  - PROGRAMME_PROJECT
  - APPROVAL_STATUS
  - SUPPLIER_PROFILE
  - REFERENCE_PROJECT
  - EXPORT_FEASIBILITY
  - PARTNERABILITY
  - OPPORTUNITY_DEVELOPMENT
  - OPPORTUNITY_MATCHING
  - EXPANSION_DISCOVERY
  - RAPID_TENDER

collection_depths:
  C0_IDENTITY: Resolve what the target is and its canonical aliases.
  C1_PROFILE: Establish an authoritative basic profile.
  C2_DOSSIER: Build a structured multi-source target dossier.
  C3_OPPORTUNITY: Resolve demand, supply, project, procurement, funding, supplier and partnership evidence around a commercial opportunity.
  C4_MONITOR: Maintain collection against defined material triggers and opportunity events.

commercial_opportunity:
  schema: schemas/opportunity.schema.json
  event_schema: schemas/opportunity-event.schema.json
  supplier_schema: schemas/supplier-intelligence.schema.json
  supplier_match_schema: schemas/opportunity-supplier-match.schema.json
  lifecycle: [S0, S1, S2, S3, S4, S5, S6, S7, S8, S9]
  modes: [SHAPE, POSITION, REACT, EXPAND]
  pre_px_identity: true
  px_identity_requires_atlas_authorization: true
  event_driven_early_warning: true
  demand_first_discovery: true
  supply_first_discovery: true
  rapid_tender_recovery: true

operating_loop:
  - Contextualize
  - Resolve_Targets
  - Derive_PIR
  - Derive_EEI
  - Plan_Collection
  - Plan_Sources
  - Discover
  - Acquire
  - Extract
  - Normalize
  - Resolve_Entities_Events_Relationships
  - Deduplicate
  - Classify
  - Grade_Evidence
  - Corroborate
  - Competing_Hypotheses
  - Detect_Conflicts
  - Assess_Coverage_And_Gaps
  - Develop_Opportunity_Context
  - Build_Supplier_Universe
  - Assess_Partnerability
  - Match_Demand_And_Supply
  - Calculate_Opportunity_Qualification
  - Package
  - Learn

ownership:
  atlas:
    - mission_control
    - control_plane
    - understand_and_normalize
    - minimal_domain_framing
    - routing
    - planning
    - permissions
    - approvals
    - capability_provider_selection_and_authorization
    - canonical_taxonomy_authority
    - canonical_evidence_acceptance
    - strategic_analysis
    - forecasting_and_scenarios
    - authoritative_opportunity_priority
    - promote_to_px
    - pursuit_decisions
    - bid_no_bid
    - external_outreach_authorization
    - independent_assurance_and_verification
    - persistence_authorization
    - action_authorization
    - observability_and_dashboard
    - provider_return_reconciliation
    - every_next_step
    - final_delivery
  argus:
    - business_intelligence_doctrine
    - target_resolution
    - pir_and_eei_derivation_within_authorized_mission
    - collection_planning_within_authorized_mission
    - source_planning
    - source_discovery
    - acquisition
    - extraction
    - normalization
    - entity_event_relationship_resolution
    - deduplication
    - collection_classification_suggestions
    - source_and_signal_reconciliation
    - evidence_grading_proposals
    - corroboration
    - competing_hypothesis_tracking
    - gap_and_conflict_detection
    - collection_coverage
    - early_opportunity_identity
    - opportunity_lifecycle_tracking
    - demand_intelligence
    - supply_intelligence
    - stakeholder_and_institutional_intelligence
    - competitor_intelligence
    - market_and_ecosystem_intelligence
    - procurement_and_tender_intelligence
    - supplier_universe_construction
    - supplier_partnerability_assessment
    - supplier_match_assessment
    - opportunity_qualification_calculation
    - priority_recommendation
    - early_warning_event_tracking
    - post_award_context_and_performance_intelligence
    - commercial_performance_intelligence
    - intelligence_learning_and_calibration
    - collection_packaging
  operational_exclusions:
    - bid_submission_execution
    - project_management_system_of_record
    - project_milestone_acceptance_authority
    - invoice_issuance_authority
    - payment_execution_authority
    - accounting_ledger_authority

handoff:
  current_runtime_adapter: tools/atlas_v3_provider.py
  atlas_route_state_required: READY
  explicit_activation_approval_required: true
  provider_return_target: ATLAS
  next_step_authority: ATLAS
  preserve_upstream_context: true
  collection_mission_contract: schemas/collection-mission.schema.json
  collection_plan_contract: schemas/collection-plan.schema.json
  collection_package_contract: schemas/intelligence-collection-package.schema.json
  opportunity_contract: schemas/opportunity.schema.json
  opportunity_event_contract: schemas/opportunity-event.schema.json
  supplier_intelligence_contract: schemas/supplier-intelligence.schema.json
  supplier_match_contract: schemas/opportunity-supplier-match.schema.json
  legacy_signed_transport:
    status: backward_compatibility_only
    descriptor: contracts/atlas/synchronization-compatibility.yaml

performance:
  ordinary_policy_analysis_executes_in_atlas: true
  ordinary_search_executes_in_atlas: true
  ordinary_task_executes_in_atlas: true
  deep_collection_before_activation: false
  detection_lag_kpi: true
  stopping_rule: >-
    Stop expanding collection when critical PIRs are materially satisfied or additional
    evidence is unlikely to change collection sufficiency, material uncertainty,
    opportunity identity/stage, supplier match, qualification recommendation or the next
    ATLAS action.

specializations:
  access_asia_government_commercial_opportunity_intelligence:
    status: active
    role: primary_commercial_specialization
    doctrine: spec/commercial-opportunity-intelligence.yaml
    supporting_doctrine: spec/core.md
    country_profiles:
      bangladesh: profiles/bangladesh.md
    access_asia_lifecycle: profiles/access-asia-opportunity-lifecycle.yaml
    legacy_maturity_scale: I0-I9
    legacy_maturity_status: compatibility_only

invariants:
  - ATLAS is the only operating framework and execution spine.
  - ATLAS uses exactly Understand + Normalize -> Minimal Domain Framing -> Route before substantive execution.
  - ARGUS is the ATLAS-governed 360-degree Business Intelligence playbook, not a peer operating system or underlying tool provider.
  - The technical provider value argus is a compatibility execution handle; ATLAS selects and authorizes actual capability providers and tools.
  - ARGUS never self-activates from a keyword or organization name alone; ATLAS decides whether structured collection is required.
  - ARGUS activation requires explicit user approval.
  - Direct factual retrieval remains an ATLAS direct-search or research task when structured intelligence collection is unnecessary.
  - Every ARGUS result returns to ATLAS and ATLAS owns the next step.
  - PIR and EEI may refine the mission into answerable collection questions but may not expand ATLAS-authorized scope.
  - Persons are collected only when materially and legitimately relevant to an authorized business or intelligence question.
  - ARGUS output is evidence and advisory business intelligence for ATLAS, not the final business decision or transactional execution authority.
  - ARGUS may calculate opportunity qualification, supplier-match and performance assessments but ATLAS owns authoritative priority and pursuit decisions.
  - Evidence confidence, procurement realization probability, Access Asia success probability and supplier-match confidence are distinct measures.
  - A tender does not automatically create an opportunity; one opportunity may link to multiple procurement packages, tenders, rebids or follow-ons.
  - ARGUS may develop legitimate opportunity hypotheses but may not assert a government project exists without evidence.
  - Opportunity development may support legitimate market education and pre-procurement engagement but never bribery, collusion, improper influence, unlawful specification manipulation or confidential bid-information acquisition.
