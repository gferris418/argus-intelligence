document_id: ARGUS-BD-PROC-STD-001
version: 1.3.0
status: CANDIDATE
country: Bangladesh
country_code: BD
extends:
  - profiles/bangladesh-canonical-procurement-standard-v1.2.yaml
purpose: >-
  Add first-class, auditable lifecycle handling for tender deadline extensions,
  tender validity extensions, corrigenda/addenda and re-tender/reissue cycles without
  losing prior solicitation state or creating duplicate commercial opportunities.

architecture:
  model: append_only_procurement_event_history
  registry_record_types_changed: false
  raw_source_documents_in_github: prohibited
  opportunity_identity_rule: >-
    Extension, amendment, cancellation and re-tender events do not create a new commercial
    opportunity by default. They update or replace procurement-cycle records inside the same
    underlying project/requirement/opportunity lineage unless evidence proves a distinct need.

normalization_principles:
  - A submission/closing deadline extension is not the same as a tender validity extension.
  - A corrigendum/addendum is an event container; classify the material effect(s) separately.
  - Current effective dates may change, but never overwrite event history or erase prior published dates.
  - A re-tender/reissue is a new solicitation cycle when the source officially republishes the requirement as a re-tender/reissue.
  - A re-tender must not overwrite the predecessor procurement record.
  - A re-tender normally remains in the same underlying opportunity lineage when project, package, need and institutional context reconcile.
  - Re-tender reason must be preserved when stated and do not infer a reason when the source is silent.
  - If cancellation, rejection, non-responsiveness or other cause is not explicitly evidenced, record UNKNOWN.
  - New system IDs, reference numbers, package numbers or lot identifiers in a re-tender remain typed independently.
  - Procurement-event history is append_only and source-provenanced.

procurement_event_types:
  - CORRIGENDUM
  - ADDENDUM
  - SUBMISSION_DEADLINE_EXTENSION
  - OPENING_DATE_CHANGE
  - DOCUMENT_SALE_END_CHANGE
  - TENDER_VALIDITY_EXTENSION
  - TENDER_SECURITY_VALIDITY_EXTENSION
  - CLARIFICATION
  - PREBID_UPDATE
  - CANCELLATION
  - RETENDER_ISSUED
  - REISSUE
  - AWARD

structured_types:
  procurement_event:
    fields:
      - event_type
      - scope
      - published_at
      - source_label
      - affected_field
      - previous_value
      - new_value
      - reason_raw
      - source_ref
      - notes
    scopes:
      - PRE_PROCUREMENT
      - SOLICITATION
      - EVALUATION
      - AWARD_CONTRACT

canonical_fields:
  procurement.events:
    layer: AMENDMENT_PREBID
    type: array
    semantics: append_only
    meaning: >-
      Append-only, source-provenanced history of procurement lifecycle changes including
      corrigenda, deadline extensions, tender-validity extensions, cancellations and re-tender events.
      Current effective scalar fields are derived from the latest authoritative event while
      prior values remain in this event history.

  procurement.cycle_type:
    layer: PROCUREMENT_PACKAGE
    type: enum
    values: [ORIGINAL, RETENDER, REISSUE]
    meaning: Whether this procurement record represents the original solicitation cycle or a later official re-tender/reissue cycle.

  procurement.reissue_sequence:
    layer: PROCUREMENT_PACKAGE
    type: integer
    meaning: >-
      Sequence of the solicitation cycle within the same underlying requirement. Use 0 for the original
      cycle, 1 for the first official re-tender/reissue, 2 for the next, and so on when lineage is established.

  procurement.predecessor_argus_id:
    layer: PROCUREMENT_PACKAGE
    type: string
    meaning: >-
      Canonical ARGUS PROCUREMENT record ID for the immediately preceding solicitation cycle when established.
      The successor should also carry a canonical relationship of replaces to the predecessor.

  procurement.reissue_reason_raw:
    layer: PROCUREMENT_PACKAGE
    type: string
    default_when_not_stated: UNKNOWN
    meaning: >-
      Exact source-stated reason for re-tender/reissue when available. If the source does not state a reason,
      use UNKNOWN; do not infer cancellation cause, bidder responsiveness, evaluation failure or other cause.

  solicitation.original_document_sale_end_at:
    layer: SOLICITATION
    type: datetime
    meaning: First authoritative published last-selling/document-sale end date-time before later extensions.

  solicitation.original_closing_at:
    layer: SOLICITATION
    type: datetime
    meaning: First authoritative published submission/closing date-time before later extensions.

  solicitation.original_opening_at:
    layer: SOLICITATION
    type: datetime
    meaning: First authoritative published opening date-time before later changes.

  solicitation.extension_count:
    layer: SOLICITATION
    type: integer
    meaning: Count of authoritative submission/deadline extension events affecting the solicitation.

  solicitation.original_validity_until:
    layer: EVALUATION
    type: datetime
    meaning: Original tender/proposal validity expiry when published or otherwise authoritatively available.

  solicitation.validity_until:
    layer: EVALUATION
    type: datetime
    meaning: Current effective tender/proposal validity expiry after any authorized validity extensions.

  solicitation.validity_extension_count:
    layer: EVALUATION
    type: integer
    meaning: Count of authoritative tender/proposal-validity extension events.

current_effective_date_rules:
  solicitation.document_sale_end_at: >-
    Keep the current effective last-selling date/time. Preserve the first published value in
    solicitation.original_document_sale_end_at and every change in procurement.events.
  solicitation.closing_at: >-
    Keep the current effective submission/closing date/time. Preserve the first published value in
    solicitation.original_closing_at and every change in procurement.events.
  solicitation.opening_at: >-
    Keep the current effective opening date/time. Preserve the first published value in
    solicitation.original_opening_at and every change in procurement.events.
  solicitation.validity_until: >-
    Keep the current effective bid/tender validity expiry and preserve every extension event.

extension_semantics:
  submission_deadline_extension:
    event_type: SUBMISSION_DEADLINE_EXTENSION
    identity_effect: same_procurement_record
    commercial_effect: >-
      Recalculate remaining bid window, refresh internal deadlines, supplier/OEM response timing,
      bid-security timing and submission readiness. Re-engage suppliers where the additional time changes feasibility.
  tender_validity_extension:
    event_type: TENDER_VALIDITY_EXTENSION
    identity_effect: same_procurement_record
    commercial_effect: >-
      Check supplier quotation validity, bid-security validity, approvals and tenderer consent requirements.
      Do not treat this as permission to alter the submitted tender unless the governing procurement process expressly allows it.

retender_semantics:
  event_type: RETENDER_ISSUED
  procurement_record_effect: new_procurement_cycle
  relationship_to_predecessor: replaces
  opportunity_effect: same_underlying_opportunity_lineage_by_default
  required_actions:
    - reconcile new system ID, reference number, package, lot, title, PE, project and requirement against predecessor
    - preserve predecessor record and status
    - compare new solicitation requirements against predecessor
    - re-engage suppliers/OEMs and confirm continued interest, authorization and commercial validity
    - rebuild or refresh compliance matrix, eligibility, security, pricing, deadlines and submission plan
    - create a new commercial opportunity only if evidence proves the re-tender is actually a different underlying requirement
  reason_rule: >-
    Preserve source-stated reason where available; otherwise procurement.reissue_reason_raw is UNKNOWN.

reconciliation_rules:
  - Same solicitation identity plus corrigendum/extension => update same PROCUREMENT record and append procurement.events.
  - Official re-tender/reissue => create/reconcile a successor PROCUREMENT cycle, link it with replaces, and preserve the prior cycle.
  - Same project/package/need with a new tender ID/reference is not by itself a new OPPORTUNITY.
  - If source identity and requirement materially diverge, escalate to ARGUS reconciliation instead of forcing same-lineage treatment.
