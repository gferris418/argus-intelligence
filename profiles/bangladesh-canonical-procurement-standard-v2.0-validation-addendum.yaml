document_id: ARGUS-BD-PROC-STD-002-VAL-ADD-001
version: 1.0.1
status: CANDIDATE_VALIDATION_ADDENDUM
applies_to: profiles/bangladesh-canonical-procurement-standard-v2.0.yaml
purpose: >-
  Record semantic additions discovered during representative-fixture validation without
  activating v2 or rewriting live records. These additions must be folded into the next
  v2 candidate revision before production activation.

milestone_type_additions:
  - PROCUREMENT_DOCUMENT_READY
  - EXPECTED_PUBLICATION

field_dictionary_additions:
  procurement_document_ready:
    definition: Planned or achieved date when bidding/procurement documents or justification are ready for the next procurement step.
    cardinality: zero_or_many_by_process_or_lot_scope
    when_populated: When an authoritative procurement plan separately schedules preparation/readiness of procurement documents.
    not_to_confuse_with: Actual issue/sale/download of tender documents or publication of the procurement notice.
    international_alignment: World Bank procurement-plan Draft Bidding Document / Justification milestone.
  expected_publication:
    definition: Planned date on which a procurement notice/invitation is expected to be published or advertised.
    cardinality: zero_or_many_by_notice_or_lot_scope
    when_populated: When a procurement plan or authoritative planning source publishes a future advertisement/invitation date.
    not_to_confuse_with: Actual notice publication, which belongs in notices[].published_at and is an observed publication event.
    international_alignment: World Bank procurement-plan Specific Procurement Notice / Invitation milestone and general procurement planning practice.

rules:
  - PROCUREMENT_DOCUMENT_READY is a planning/implementation milestone and does not imply documents were publicly issued.
  - EXPECTED_PUBLICATION is a milestone because the publication has not yet occurred.
  - Once a notice is actually published, preserve the planned milestone and add the actual notice/publication evidence; do not overwrite planning history.
  - This addendum is candidate-only and does not change the active Bangladesh v1.3 write standard.
