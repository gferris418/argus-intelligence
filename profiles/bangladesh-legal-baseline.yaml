quality_rules:
  - This file is a dated operating baseline, never permanent legal truth.
  - Cached summaries never substitute for the current official Act, Rules, Gazette, circular, standard document, financier rule or tender-specific condition.
  - A news item or cabinet approval is not treated as enacted law unless official legal effect is established.
  - Special regimes, defence, G2G, donor-financed and other route-specific rules must be independently checked before reliance.
