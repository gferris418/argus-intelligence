document_id: ARGUS-BD-PROC-STD-001
version: 1.2.0
status: CANDIDATE
country: Bangladesh
country_code: BD
extends:
  - profiles/bangladesh-data-standard.yaml
  - profiles/bangladesh-canonical-procurement-standard-v1.1.yaml
purpose: >-
  Correct Bangladesh solicitation identity semantics and make the distinction portable
  across e-GP, BPPA, DGDP/e-DP and other procurement sources.

governing_correction:
  rule: >-
    A portal/system-generated Tender/Proposal ID and a procuring-entity invitation,
    tender or proposal reference number are different typed identifiers. They must never
    overwrite, alias or substitute for each other merely because both identify the same
    solicitation event.
  evidence:
    - source: BPPA/e-GP
      pattern: "Tender/Proposal ID and Invitation Reference No. are published separately"
    - source: DGDP/e-DP
      pattern: "Tender No is the procuring authority reference carried by the DGDP tender stream"

canonical_fields:
  solicitation.system_id:
    layer: SOLICITATION
    type: string
    meaning: >-
      Portal-generated Tender/Proposal ID or equivalent source-system identifier.
      In Bangladesh e-GP this is the numeric Tender/Proposal ID generated by the e-GP system.
      It is not the procuring entity's invitation/tender/proposal reference number.
    examples:
      - "1245173"
      - "1141480"

  solicitation.reference_no:
    layer: SOLICITATION
    type: string
    meaning: >-
      Procuring-entity invitation/tender/proposal reference number assigned in the
      organization's own numbering system. This remains distinct from solicitation.system_id.
    examples:
      - "JUST/FVM/2025-2026/GD 01/23/2"
      - "44.08.2680.033.02.106.26.160"
      - "219.282.26"

  solicitation.id:
    layer: SOLICITATION
    type: string
    status: deprecated
    do_not_write_new_records: true
    meaning: >-
      Legacy generic solicitation identifier retained only for backward compatibility.
      New observations and canonical writes must use solicitation.system_id for portal IDs
      and solicitation.reference_no for procuring-entity references.

identity_precedence:
  exact_typed_identifiers:
    - solicitation.system_id
    - solicitation.reference_no
    - procurement.app_id
    - procurement.activity_reference_no
    - procurement.package_no
    - procurement.lot_no
    - procurement.lot_identification
    - award.contract_no
  rule: >-
    Matching is strongest when the same identifier type matches. Cross-type equality alone
    never proves identity. A Tender/Proposal ID must not be matched to an Invitation Reference
    No. as though they were the same field.

source_semantics:
  BPPA_EGP:
    Tender/Proposal ID: solicitation.system_id
    Invitation Reference No.: solicitation.reference_no
    Tender Ref. No.: solicitation.reference_no
  DGDP_EDP:
    Tender No: solicitation.reference_no
    system_generated_id: solicitation.system_id_if_exposed
  OTHER_PORTALS:
    rule: >-
      Determine whether the source value is portal-generated or procuring-entity assigned.
      Preserve the source label and map only when semantics are clear.

backward_compatibility:
  read_legacy_solicitation_id: true
  migrate_when_semantics_known: true
  never_guess_legacy_identifier_type: true
