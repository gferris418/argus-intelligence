document_id: ARGUS-BD-SOURCE-MAP-001
version: 1.0.0
status: CANDIDATE
country_code: BD
purpose: >-
  Map common Bangladesh public-sector source families and their source-specific
  labels into the canonical Bangladesh Data Standard. The catalog describes
  what is usually available; it does not imply every source record contains
  every listed datapoint.

mapping_rules:
  - Preserve source label/value before normalization.
  - A field mapping means the source label may populate the canonical field when actually observed.
  - Do not create a datapoint merely because a source family normally contains that field.
  - Use source IDs/typed identifiers before fuzzy name matching.
  - When the same concept appears in multiple sources, retain source-specific observations and reconcile downstream.
  - Official source fields do not automatically become ATLAS VERIFIED; ATLAS assurance remains separate.

source_profiles:
  BPPA_EGP_APP:
    authority: official_procurement_plan
    typical_layers: [INSTITUTION, PROGRAMME_PROJECT, FUNDING, PROCUREMENT_PLAN, PROCUREMENT_PACKAGE]
    typical_available_data:
      - ministry/division/organization/procuring entity and district
      - financial year and budget type
      - project name
      - APP ID and APP code
      - procurement nature/type
      - package number and description
      - estimated cost
      - procurement method
      - category
    field_mappings:
      - {source_label: Ministry, canonical_field: institution.ministry_name}
      - {source_label: Division, canonical_field: institution.division_name}
      - {source_label: Organization, canonical_field: institution.organization_name}
      - {source_label: Procuring Entity, canonical_field: institution.pe_name}
      - {source_label: PE Office, canonical_field: institution.pe_name}
      - {source_label: District, canonical_field: institution.district}
      - {source_label: Financial Year, canonical_field: procurement.financial_year}
      - {source_label: Budget Type, canonical_field: funding.budget_type}
      - {source_label: Project Name, canonical_field: project.name}
      - {source_label: APP ID, canonical_field: procurement.app_id}
      - {source_label: APP Code, canonical_field: procurement.app_code}
      - {source_label: Procurement Nature, canonical_field: procurement.nature}
      - {source_label: Procurement Type, canonical_field: procurement.type}
