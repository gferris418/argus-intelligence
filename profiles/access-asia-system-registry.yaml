schema_version: 2
registry_id: access-asia-system-of-record
version: 1.2.0
effective_date: 2026-10-22
scope: Access Asia ATLAS/ARGUS/CRM/document persistence routing

principle: governed_authority_by_information_class

security:
  github_visibility_verified: public
  verified_date: 2026-10-22
  never_commit:
    - credentials_or_secrets
    - authentication_tokens
    - sharepoint_sharing_tokens
    - sharepoint_drive_ids
    - sharepoint_item_ids
    - hubspot_native_record_ids
    - contact_personal_data
    - confidential_crm_exports
    - restricted_source_payloads
  native_external_ids: resolve_at_runtime

systems:
  atlas_github:
    repository: gferris418/atlas-os
    role: execution_and_persistence_governance
    owns:
      - mission_control
      - control_plane
      - routing
      - approvals
      - action_authorization
      - persistence_routing
      - verification
      - atlas_policy_runtime_and_registry

  argus_github:
    repository: gferris418/argus-intelligence
    role: argus_schema_governance_code_migrations_and_versioned_release_snapshots
    owns:
      - canonical_identity_standard
      - commercial_data_standard
      - database_schema
      - migration_logic
      - government_commercial_intelligence_method
      - opportunity_intelligence_method
      - supplier_capability_intelligence_method
      - opportunity_supplier_matching_contracts
      - evidence_and_provenance_contracts
      - public_sector_institutional_intelligence_contracts
      - versioned_registry_baselines_and_release_snapshots
    excludes:
      - current_mutable_operational_argus_state
      - crm_relationship_history
      - personal_contactability_data
      - raw_source_documents
      - working_business_documents

  argus_sharepoint_sqlite:
    role: canonical_current_mutable_commercial_and_argus_operational_structured_state
    format: SQLite
    logical_name: ARGUS Master Registry
    logical_path: General/Business Intelligence/30_OPERATIONS/ARGUS_Master_Registry.sqlite
    schema_authority: schemas/argus-operational-store-v1.sql
    identity_authority: profiles/canonical-object-identity-standard-v1.0.yaml
    commercial_data_authority: profiles/access-asia-commercial-data-standard-v1.0.yaml
    mutation_model: single_writer_fetch_latest_modify_transactionally_verify_replace
    version_history: SHAREPOINT_FILE_VERSIONS
    public_git_item_ids: prohibited
    owns:
      - canonical_commercial_graph
      - canonical_objects_current_state
      - canonical_organization_identity
      - canonical_person_identity_when_material
      - canonical_product_and_solution_identity
      - government_project_requirement_and_procurement_lineage
      - px_opportunities
      - bids
      - awards
      - access_asia_projects
      - structured_contract_facts
      - structured_financial_facts
      - external_identifiers
      - canonical_relationships
      - source_record_index
      - source_releases
      - events
      - observations
      - current_object_payloads
      - operational_mutation_log

  hubspot:
    role: canonical_crm_relationship_and_engagement_system
    owns:
      - access_asia_relationship_state
      - contactability_and_contact_details
      - commercial_interactions
      - crm_deals_and_pipeline_workflow
      - crm_tasks_notes_calls_and_emails
    mirrors:
      - argus_organization_identity_for_engaged_accounts
      - argus_person_identity_when_a_crm_contact_is_required
    cross_system_key:
      preferred_property: argus_party_id
      value_source: stable_argus_organization_id
      native_record_id_storage_in_public_git: prohibited

  sharepoint:
    role: canonical_document_working_file_and_argus_operational_database_store
    hostname: accessasiaccl.sharepoint.com
    site_path: /sites/accessasia
    site_display_name: Access Asia Limited
    document_library: Documents
    business_intelligence_root: General/Business Intelligence
    business_intelligence_structure:
      - 10_SOURCE_MAP
      - 20_ARCHITECTURE
      - 30_OPERATIONS
      - 40_VALIDATION
      - 50_OPPORTUNITIES
      - 90_ARCHIVE
      - 99_INBOX
    operational_database: General/Business Intelligence/30_OPERATIONS/ARGUS_Master_Registry.sqlite
    lifecycle_locations:
      tracked_pre_submission: General/Business Intelligence/50_OPPORTUNITIES
      submission_active: General/REV/OPP Opportunities
      awarded_project: General/OPS/PRJ Projects
    native_item_id_storage_in_public_git: prohibited
    sharing_query_parameter_storage_in_public_git: prohibited

persistence_routing:
  CANONICAL_ORGANIZATION: ARGUS_SHAREPOINT_SQLITE
  CANONICAL_PERSON: ARGUS_SHAREPOINT_SQLITE
  CANONICAL_PRODUCT: ARGUS_SHAREPOINT_SQLITE
  CANONICAL_PRODUCT_CATEGORY: ARGUS_SHAREPOINT_SQLITE
  CANONICAL_SECTOR: ARGUS_SHAREPOINT_SQLITE
  CANONICAL_GEOGRAPHY: ARGUS_SHAREPOINT_SQLITE
  GOVERNMENT_PROJECT: ARGUS_SHAREPOINT_SQLITE
  REQUIREMENT: ARGUS_SHAREPOINT_SQLITE
  PROCUREMENT: ARGUS_SHAREPOINT_SQLITE
  TENDER: ARGUS_SHAREPOINT_SQLITE
  PX_OPPORTUNITY: ARGUS_SHAREPOINT_SQLITE
  BID: ARGUS_SHAREPOINT_SQLITE
  AWARD: ARGUS_SHAREPOINT_SQLITE
  ACCESS_ASIA_PROJECT: ARGUS_SHAREPOINT_SQLITE
  CONTRACT_FACT: ARGUS_SHAREPOINT_SQLITE
  FINANCIAL_FACT: ARGUS_SHAREPOINT_SQLITE
  CRM_COMPANY_MIRROR: HUBSPOT
  CRM_CONTACTABILITY: HUBSPOT
  CRM_RELATIONSHIP: HUBSPOT
  CRM_DEAL: HUBSPOT
  CRM_INTERACTION: HUBSPOT
  SOURCE_DOCUMENT: SHAREPOINT
  WORKING_DOCUMENT: SHAREPOINT
  OPPORTUNITY_FOLDER: SHAREPOINT
  PROJECT_DOCUMENT: SHAREPOINT
  FINANCIAL_EVIDENCE_DOCUMENT: SHAREPOINT
  ARGUS_CURRENT_STRUCTURED_STATE: ARGUS_SHAREPOINT_SQLITE
  ARGUS_CANONICAL_OBJECT: ARGUS_SHAREPOINT_SQLITE
  ARGUS_OPPORTUNITY: ARGUS_SHAREPOINT_SQLITE
  ARGUS_EVENT: ARGUS_SHAREPOINT_SQLITE
  ARGUS_OBSERVATION: ARGUS_SHAREPOINT_SQLITE
  ARGUS_MATCH_CURRENT_STATE: ARGUS_SHAREPOINT_SQLITE
  ARGUS_SCHEMA: ARGUS_GITHUB
  ARGUS_IDENTITY_RULES: ARGUS_GITHUB
  ARGUS_COMMERCIAL_DATA_RULES: ARGUS_GITHUB
  ARGUS_MIGRATION: ARGUS_GITHUB
  ARGUS_RELEASE_SNAPSHOT: ARGUS_GITHUB
  ARGUS_EVIDENCE_REFERENCE: ARGUS_SHAREPOINT_SQLITE
  ATLAS_POLICY: ATLAS_GITHUB
  ATLAS_RUNTIME: ATLAS_GITHUB
  ATLAS_REGISTRY: ATLAS_GITHUB

cross_system_linking:
  preferred_pattern: stable_integration_key_plus_runtime_resolution
  organization_key: canonical_organization_id
  person_key: canonical_person_id
  hubspot_key: argus_party_id
  opportunity_keys:
    - argus_opportunity_id
    - commercial_px_id
  bid_key: canonical_bid_id
  project_key: access_asia_project_id
  sharepoint_reference: logical_site_and_folder_path
  database_object_key: canonical_id
  database_primary_key: internal_uuid
  parallel_live_argus_databases: prohibited
  public_git_copy_of_current_mutable_database: prohibited

reporting_policy:
  principle: derived_views_over_canonical_graph
  department_master_databases: prohibited
  views:
    - MARKETING
    - SALES
    - BUSINESS_DEVELOPMENT
    - OPERATIONS
    - FINANCE
    - MANAGEMENT
  reports_are_sources_of_truth: false

operational_database_protocol:
  open_sqlite_in_place_over_sharepoint_sync: prohibited
  concurrent_writers: prohibited
  steps:
    - fetch_latest_sharepoint_file
    - verify_target_and_integrity
    - resolve_identity_before_creation
    - mutate_locally_in_single_transaction
    - preserve_source_provenance
    - record_mutation_log
    - run_integrity_and_foreign_key_checks
    - replace_same_sharepoint_file
    - verify_uploaded_target_and_version
  rollback: sharepoint_file_version_history

lifecycle:
  promote_to_px:
    sharepoint_home: General/Business Intelligence/50_OPPORTUNITIES
    move_to_submission: false
  tender_published:
    move_to_submission: false
  submission_active:
    source: General/Business Intelligence/50_OPPORTUNITIES
    destination: General/REV/OPP Opportunities
    move_existing_lineage: true
  awarded_or_contract_activated:
    source: General/REV/OPP Opportunities
    destination: General/OPS/PRJ Projects
    move_existing_lineage: true
