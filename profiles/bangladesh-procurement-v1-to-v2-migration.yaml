document_id: ARGUS-BD-PROC-MIG-001
version: 1.0.0
status: CANDIDATE
from_versions: [1.0.1, 1.1.0, 1.2.0, 1.3.0]
to_version: 2.0.0
allowed_actions: [KEEP, RENAME, MERGE, DERIVE, DEPRECATE]
rule: >-
  Every v1.x canonical field is accounted for before any live record migration. RENAME changes
  the canonical home without changing meaning; MERGE consolidates multiple old fields into one
  structured concept or linked canonical record; DERIVE means the value is computed from v2
  canonical structures; DEPRECATE means the old field is semantically unsafe/redundant and must
  not be written in v2 without source-semantic resolution.

mappings:
