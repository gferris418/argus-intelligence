document_id: ARGUS-BD-PROC-STD-002
version: 2.0.0
status: CANDIDATE
country: Bangladesh
country_code: BD
write_contract: schemas/bangladesh-procurement-v2.schema.json
supersedes_after_migration:
  - profiles/bangladesh-data-standard.yaml
  - profiles/bangladesh-canonical-procurement-standard-v1.1.yaml
  - profiles/bangladesh-canonical-procurement-standard-v1.2.yaml
  - profiles/bangladesh-canonical-procurement-standard-v1.3.yaml
purpose: >-
  Define a semantically deduplicated Bangladesh public-procurement data model that works
  across ministries, divisions, departments, directorates, authorities, SOEs, local bodies,
  defence/DGDP, PPP procurement and development-partner procurement. One real-world concept
  has one canonical home. Source-specific labels are preserved as evidence, not duplicated as
  new canonical fields.

international_alignment:
  OCDS:
    principle: contracting_process_lifecycle
    reference: Open Contracting Data Standard 1.1.5
    adopted_concepts: [parties, tender_process, items, awards, contracts, implementation, milestones]
  EU_EFORMS:
    principle: distinguish_procedure_notice_version_and_lot_identity
    adopted_concepts: [procedure_identity, notice_identity, notice_version, lot_identity]
  UNCITRAL:
    principle: transparent_objective_competitive_procurement
    adopted_concepts: [competition, participation, integrity, transparency]
  WORLD_BANK:
    principle: separate_strategy_plan_procurement_activity_and_contract_management
    adopted_concepts: [planning, review_control, procurement_process, contract_management]

semantic_principles:
  - One real-world concept has one canonical home.
  - Store source labels and raw values in observations; do not create portal-specific canonical fields.
  - Canonical ENTITY, PROJECT, SUPPLIER_PRODUCT, KNOWLEDGE and OPPORTUNITY data are referenced, not copied into each PROCUREMENT record.
  - A procurement record stores typed party-role links instead of repeating ministry, division, organization, PE and end-user names.
  - Different identifier types never substitute for one another even when their string values match.
  - A notice is a publication about a procurement process; it is not the procurement process itself.
  - A milestone represents a scheduled or achieved point in time; an event represents something that happened or changed.
  - Planned publication is a milestone; actual publication is a notice/publication event.
  - Procurement-document readiness does not imply public issuance of those documents.
  - Original and current dates are represented by milestone history and events, not duplicate scalar fields.
  - Counts that can be calculated from canonical arrays are derived and are not stored as authoritative facts.
  - Award and contract are different lifecycle objects. A contract number belongs to the contract, not the award.
  - Budget allocation and financing source/instrument are different concepts.
  - Procurement category, competition scope, selection method and procedure configuration are different concepts.
  - Missing information remains absent or explicitly unknown; source-template expectations never fabricate values.
  - Every material value is traceable to an observation/evidence source.

storage_boundary:
  registry_record_types_changed: false
  procurement_record_type: PROCUREMENT
  linked_record_types: [ENTITY, PROJECT, INTELLIGENCE, OPPORTUNITY, SUPPLIER_PRODUCT, KNOWLEDGE]
  raw_source_documents_in_github: prohibited
  write_schema: schemas/bangladesh-procurement-v2.schema.json
  live_record_migration: DEFERRED

structured_types:
  typed_identifier:
    fields: [scheme, value, scope, source_system, source_label]
  related_record_ref:
    fields: [argus_id, relation_type]
  party_role_link:
    fields: [party_id, role, source_role_label, unit_label, effective_from, effective_to]
  budget:
    fields: [type, fiscal_year, amount, currency, line_reference]
  financing:
    fields: [source_party_id, instrument, reference, amount, currency, commitment_date, status, conditions, scope]
  process:
    fields: [route, category, method_normalized, method_source_code, method_source_label, competition_scope, configuration, review_type, prequalification_required, framework_agreement, status_raw, status_normalized, estimated_value, currency]
  lot:
    fields: [lot_id, lot_reference, title, description, estimated_value, currency, delivery_location]
  item:
    fields: [item_id, description, quantity, unit, lot_ref, classifications]
  notice:
    fields: [notice_id, notice_type, version, published_at, source_system, source_locator]
  milestone:
    fields: [milestone_id, type, due_at, original_due_at, date_met, date_modified, status, lot_ref, source_ref]
  event:
    fields: [event_id, type, occurred_at, notice_ref, reason_raw, changes, source_ref]
  requirement:
    fields: [requirement_id, type, text, normalized_value, mandatory, scope, lot_ref, source_ref]
  fee:
    fields: [fee_id, type, amount, currency, raw_text, refundable, lot_ref, source_ref]
  security:
    fields: [security_id, type, amount, currency, raw_text, validity_until, lot_ref, source_ref]
  contact_point:
    fields: [contact_id, party_id, purpose, name, designation, address, email, phone, source_ref]
  award:
    fields: [award_id, award_date, status, supplier_party_ids, lot_refs, value, currency, approval_reference, financing]
  contract:
    fields: [contract_id, contract_number, award_ref, supplier_party_ids, value, currency, signed_at, period_start, period_end, status]
  implementation:
    fields: [status, progress_pct, actual_completion_date, current_value, currency, milestones, transactions, modifications]
  observation:
    fields: [observation_id, field_path, value, raw_label, raw_value, source_id, source_system, source_locator, observed_at, published_at, claim_type, condition, assurance]
  intelligence:
    fields: [maturity, activation_mode, commercial_fit, supplier_discovery_state, material_unknowns, research_frontier, next_action]

role_vocabularies:
  party_roles:
    - SPONSORING_MINISTRY
    - PARENT_DIVISION
    - IMPLEMENTING_AGENCY
    - BUYER
    - PROCURING_ENTITY
    - PROCUREMENT_AGENT
    - PROCUREMENT_UNIT
    - END_USER
    - PROJECT_OFFICE
    - APPROVING_AUTHORITY
    - FUNDER
    - REGULATOR
    - TENDERER
    - SUPPLIER
  process_categories: [GOODS, WORKS, CONSULTING_SERVICES, NON_CONSULTING_SERVICES]
  method_normalized: [OPEN, SELECTIVE, LIMITED, DIRECT, OTHER]
  competition_scope: [NATIONAL, INTERNATIONAL, RESTRICTED_BY_FINANCING, OTHER]
  configurations: [ONE_STAGE_ONE_ENVELOPE, ONE_STAGE_TWO_ENVELOPE, TWO_STAGE, TWO_STAGE_TWO_ENVELOPE, OTHER]
  requirement_types:
    - REGISTRATION
    - ENLISTMENT
    - LEGAL
    - EXPERIENCE
    - FINANCIAL_CAPACITY
    - TECHNICAL_CAPABILITY
    - OEM_AUTHORIZATION
    - SOURCE_COUNTRY
    - LOCAL_PARTICIPATION
    - JV_REQUIREMENT
    - STANDARD_CERTIFICATION
    - SUSTAINABILITY
    - SECURITY_CLEARANCE
    - OTHER
  milestone_types:
    - PROCUREMENT_DOCUMENT_READY
    - EXPECTED_PUBLICATION
    - DOCUMENT_SALE_START
    - DOCUMENT_SALE_END
    - PREBID_MEETING
    - CLARIFICATION_DEADLINE
    - SECURITY_DEADLINE
    - SUBMISSION_DEADLINE
    - OPENING
    - VALIDITY_END
    - SECURITY_VALIDITY_END
    - EVALUATION_COMPLETE
    - EXPECTED_AWARD
    - CONTRACT_SIGNING
    - DELIVERY
    - COMPLETION
  event_types:
    - PUBLICATION
    - CORRIGENDUM
    - ADDENDUM
    - CLARIFICATION
    - DEADLINE_EXTENSION
    - OPENING_DATE_CHANGE
    - VALIDITY_EXTENSION
    - SECURITY_VALIDITY_EXTENSION
    - CANCELLATION
    - RETENDER
    - REISSUE
    - AWARD
    - CONTRACT_SIGNING
  fee_types: [TENDER_DOCUMENT, SCHEDULE_PURCHASE, OTHER]
  security_types: [TENDER_SECURITY, PERFORMANCE_SECURITY, ADVANCE_PAYMENT_GUARANTEE, RETENTION, OTHER]

field_dictionary:
  argus_id:
    definition: Permanent ARGUS identifier for this procurement process/cycle.
    cardinality: one
    when_populated: Always.
    not_to_confuse_with: External tender, package, project or contract identifiers.
    international_alignment: Stable contracting-process identity.
  requirement_ref:
    definition: Stable link to the underlying need shared across planning, tender and re-tender cycles.
    cardinality: zero_or_one
    when_populated: When underlying requirement lineage has been reconciled.
    not_to_confuse_with: Procurement or project identity.
    international_alignment: ARGUS lineage extension.
  title:
    definition: Normalized human-readable title of the procurement cycle.
    cardinality: one
    when_populated: Always once any reliable title/item description is known.
    not_to_confuse_with: Project title or notice title.
    international_alignment: OCDS tender title.
  description:
    definition: Concise normalized procurement-scope description.
    cardinality: zero_or_one
    when_populated: When title alone does not adequately express scope.
    not_to_confuse_with: Raw source wording retained in observations.
    international_alignment: OCDS tender description.
  record_state:
    definition: State of the ARGUS record itself.
    cardinality: one
    when_populated: Always.
    not_to_confuse_with: Procurement, award, contract or implementation status.
    international_alignment: Internal data-governance state.
  record_revision:
    definition: Monotonic revision number of the ARGUS canonical record.
    cardinality: one
    when_populated: Always.
    not_to_confuse_with: Notice version or re-tender sequence.
    international_alignment: Internal revision control.
  identifiers:
    definition: Typed external identifiers attached to the procurement or planning scope.
    cardinality: zero_or_many
    when_populated: Whenever a source publishes a typed identifier.
    not_to_confuse_with: Aliases or another identifier type with the same value.
    international_alignment: OCDS/eForms typed-identity principle.
  identifier_scheme:
    definition: Semantic identifier type such as SYSTEM_TENDER_ID, TENDER_REFERENCE_NO or PACKAGE_NO.
    cardinality: one_per_identifier
    when_populated: For every identifier.
    not_to_confuse_with: Source label.
    international_alignment: eForms procedure/notice/lot identity separation.
  identifier_value:
    definition: Exact identifier value preserved as a string.
    cardinality: one_per_identifier
    when_populated: For every identifier.
    not_to_confuse_with: Numeric interpretation of an identifier.
    international_alignment: Stable identifier practice.
  identifier_scope:
    definition: Lifecycle/object scope identified by the identifier.
    cardinality: one_per_identifier
    when_populated: For every identifier.
    not_to_confuse_with: Identifier scheme.
    international_alignment: Relational identifier scoping.
  related_record_refs:
    definition: Links to canonical ENTITY, PROJECT, OPPORTUNITY, SUPPLIER_PRODUCT, INTELLIGENCE or KNOWLEDGE records.
    cardinality: zero_or_many
    when_populated: When the procurement is reconciled to another canonical record.
    not_to_confuse_with: Copying linked-record attributes into procurement.
    international_alignment: Relational normalization.
  party_role_links:
    definition: Links canonical parties to the role they perform in this procurement.
    cardinality: zero_or_many
    when_populated: When institutional or supplier roles are evidenced.
    not_to_confuse_with: Government hierarchy stored on ENTITY records.
    international_alignment: OCDS parties and roles.
  party_id:
    definition: Canonical ENTITY identifier of the linked party.
    cardinality: one_per_role_link
    when_populated: For every role link.
    not_to_confuse_with: PE code or source-system organization ID.
    international_alignment: OCDS organization linkage.
  party_role:
    definition: Functional role performed by the party in this procurement.
    cardinality: one_per_role_link
    when_populated: For every role link.
    not_to_confuse_with: Organization type or hierarchy.
    international_alignment: OCDS roles localized for Bangladesh.
  unit_label:
    definition: Published procurement wing/section/cell below a canonical party when a separate ENTITY is not justified.
    cardinality: zero_or_one_per_role_link
    when_populated: When the source names an operating unit such as Navy Wing or NP-8.
    not_to_confuse_with: Procuring-entity identity.
    international_alignment: Local organizational-unit extension.
  budget_type:
    definition: Bangladesh budget classification specific to the procurement.
    cardinality: zero_or_one
    when_populated: When Revenue, Development, Own Fund or equivalent is stated.
    not_to_confuse_with: Financing source or instrument.
    international_alignment: Local fiscal classification.
  budget_fiscal_year:
    definition: Fiscal year of the procurement-specific budget allocation.
    cardinality: zero_or_one
    when_populated: When tied to a fiscal year.
    not_to_confuse_with: APP or project fiscal year when different.
    international_alignment: Local fiscal classification.
  budget_amount:
    definition: Procurement-specific amount allocated in the applicable budget.
    cardinality: zero_or_one
    when_populated: Only when explicitly evidenced.
    not_to_confuse_with: Project cost, estimated procurement value or contract value.
    international_alignment: OCDS planning/budget concept.
  budget_currency:
    definition: Currency of budget amount.
    cardinality: zero_or_one
    when_populated: When budget amount exists.
    not_to_confuse_with: Procurement or contract currency.
    international_alignment: Value/currency pattern.
  budget_line_reference:
    definition: Budget line/economic-code/allocation reference tied to procurement.
    cardinality: zero_or_one
    when_populated: When published.
    not_to_confuse_with: APP, package or project identifier.
    international_alignment: Fiscal-reference practice.
  financing_entries:
    definition: Structured funding contributions or instruments applying to the procurement/project scope.
    cardinality: zero_or_many
    when_populated: When a financing source/instrument is evidenced.
    not_to_confuse_with: Budget classification.
    international_alignment: IFI financing-reference practice.
  financing_source_party_id:
    definition: Canonical party supplying finance.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When financier identity is known.
    not_to_confuse_with: Buyer, implementing agency or procuring entity.
    international_alignment: Party-based financier representation.
  financing_instrument:
    definition: Legal/economic form of finance such as government allocation, loan, credit, grant or own fund.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When known.
    not_to_confuse_with: Budget type.
    international_alignment: IFI financing semantics.
  financing_reference:
    definition: Loan, credit, grant or financing-agreement reference.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When published.
    not_to_confuse_with: Tender, package or project identifier.
    international_alignment: IFI financing identifiers.
  financing_amount:
    definition: Amount contributed by the financing entry.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When contribution amount is stated.
    not_to_confuse_with: Total project, procurement or contract value.
    international_alignment: Financial contribution value.
  financing_currency:
    definition: Currency of financing amount.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When financing amount exists.
    not_to_confuse_with: Contract currency.
    international_alignment: Value/currency pattern.
  financing_commitment_date:
    definition: Date the financing commitment/agreement became formally committed.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When authoritative financing evidence states it.
    not_to_confuse_with: Procurement-plan or project-approval date.
    international_alignment: IFI financing lifecycle.
  financing_status:
    definition: Current financing state such as proposed, approved, signed, effective or disbursing.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When evidenced.
    not_to_confuse_with: Project or procurement status.
    international_alignment: IFI financing lifecycle.
  financing_conditions:
    definition: Financing-linked procurement or source-country conditions.
    cardinality: zero_or_many_per_financing_entry
    when_populated: When tied/untied/eligible-country conditions are stated.
    not_to_confuse_with: General tender eligibility requirements.
    international_alignment: Bilateral/IFI financing conditions.
  process_route:
    definition: ARGUS Bangladesh acquisition-route classification.
    cardinality: zero_or_one
    when_populated: After route classification is supported.
    not_to_confuse_with: Competition scope or method.
    international_alignment: ARGUS jurisdiction context.
  process_category:
    definition: "Top-level object being procured: goods, works, consulting or non-consulting services."
    cardinality: zero_or_one
    when_populated: When source category/nature is known.
    not_to_confuse_with: Method or competition scope.
    international_alignment: OCDS mainProcurementCategory.
  process_method_normalized:
    definition: Internationally normalized supplier-selection method.
    cardinality: zero_or_one
    when_populated: When source method is known and safely normalizable.
    not_to_confuse_with: OTM/LTM source code, NCT/ICT or envelope configuration.
    international_alignment: OCDS procurementMethod.
  process_method_source_code:
    definition: Exact source method code such as OTM, LTM, RFQ, DPM or RFB.
    cardinality: zero_or_one
    when_populated: When source exposes a code.
    not_to_confuse_with: Normalized method.
    international_alignment: Source preservation.
  process_method_source_label:
    definition: Exact source-published method label.
    cardinality: zero_or_one
    when_populated: When available.
    not_to_confuse_with: Normalized method.
    international_alignment: Source preservation.
  process_competition_scope:
    definition: Market scope/eligibility of competition such as national or international.
    cardinality: zero_or_one
    when_populated: When NCT/ICT or equivalent is evidenced.
    not_to_confuse_with: Procurement method.
    international_alignment: Market-approach concept.
  process_configuration:
    definition: Procedure structure such as one-stage two-envelope or two-stage.
    cardinality: zero_or_one
    when_populated: When explicitly known.
    not_to_confuse_with: Method or competition scope.
    international_alignment: IFI process configuration.
  process_review_type:
    definition: Financier review/control classification such as prior or post review.
    cardinality: zero_or_one
    when_populated: When stated.
    not_to_confuse_with: Method or approval status.
    international_alignment: World Bank/ADB review control.
  process_prequalification_required:
    definition: Whether formal prequalification/preselection is required.
    cardinality: zero_or_one
    when_populated: When explicitly stated.
    not_to_confuse_with: General eligibility criteria.
    international_alignment: IFI/OCDS qualification practice.
  process_framework_agreement:
    definition: Whether procurement establishes or uses a framework agreement.
    cardinality: zero_or_one
    when_populated: When explicitly identified.
    not_to_confuse_with: Multi-lot procurement.
    international_alignment: UNCITRAL/OCDS framework concept.
  process_status_raw:
    definition: Exact procurement-process status text from source.
    cardinality: zero_or_one_per_current_source
    when_populated: When source publishes status.
    not_to_confuse_with: ARGUS record state.
    international_alignment: Source-status preservation.
  process_status_normalized:
    definition: ARGUS normalized procurement-process state.
    cardinality: zero_or_one
    when_populated: Only when evidence supports normalization.
    not_to_confuse_with: Record, project or contract status.
    international_alignment: OCDS tender status localized to ARGUS.
  process_estimated_value:
    definition: Pre-award estimated value of the procurement process/package.
    cardinality: zero_or_one
    when_populated: When authoritative estimate is available.
    not_to_confuse_with: Budget, award or contract value.
    international_alignment: OCDS tender value.
  process_currency:
    definition: Currency of estimated procurement value.
    cardinality: zero_or_one
    when_populated: When estimated value exists.
    not_to_confuse_with: Tender currency basis or contract currency.
    international_alignment: Value/currency pattern.
  lots:
    definition: Separately identifiable lots within one procurement process.
    cardinality: zero_or_many
    when_populated: When source defines lots.
    not_to_confuse_with: Package or process identity.
    international_alignment: eForms/OCDS lot model.
  lot_id:
    definition: Source/internal identity of a lot.
    cardinality: one_per_lot
    when_populated: For every structured lot.
    not_to_confuse_with: Package number or lot reference.
    international_alignment: eForms lot identifier.
  lot_reference:
    definition: Additional published lot code such as WD-2 when distinct from lot_id.
    cardinality: zero_or_one_per_lot
    when_populated: When separately published.
    not_to_confuse_with: Package number.
    international_alignment: Localized lot reference.
  lot_title:
    definition: Human-readable lot title.
    cardinality: zero_or_one_per_lot
    when_populated: When published or safely normalized.
    not_to_confuse_with: Process title.
    international_alignment: eForms/OCDS lot title.
  lot_description:
    definition: Additional scope description specific to the lot.
    cardinality: zero_or_one_per_lot
    when_populated: When available.
    not_to_confuse_with: Item description.
    international_alignment: Lot description semantics.
  lot_estimated_value:
    definition: Pre-award estimated value specific to a lot.
    cardinality: zero_or_one_per_lot
    when_populated: When explicitly published.
    not_to_confuse_with: Process total or award value.
    international_alignment: eForms/OCDS lot value.
  lot_currency:
    definition: Currency of lot estimated value.
    cardinality: zero_or_one_per_lot
    when_populated: When lot value exists.
    not_to_confuse_with: Process currency.
    international_alignment: Value/currency pattern.
  lot_delivery_location:
    definition: Delivery/performance location specific to a lot.
    cardinality: zero_or_one_per_lot
    when_populated: When published.
    not_to_confuse_with: Procuring-entity address.
    international_alignment: OCDS delivery-location practice.
  items:
    definition: Goods, works or services line items being procured.
    cardinality: zero_or_many
    when_populated: When line items can be identified.
    not_to_confuse_with: Lots.
    international_alignment: OCDS items model.
  item_id:
    definition: Stable identity of an item row inside the process.
    cardinality: one_per_item
    when_populated: For every item.
    not_to_confuse_with: Product taxonomy code.
    international_alignment: OCDS item id.
  item_description:
    definition: Description of the good, work or service item.
    cardinality: one_per_item
    when_populated: For every item.
    not_to_confuse_with: Process or lot title.
    international_alignment: OCDS item description.
  item_quantity:
    definition: Numeric quantity of the item when meaningful.
    cardinality: zero_or_one_per_item
    when_populated: When source states quantity.
    not_to_confuse_with: Lot count.
    international_alignment: OCDS item quantity.
  item_unit:
    definition: Unit of measure applying to item quantity.
    cardinality: zero_or_one_per_item
    when_populated: When source states unit.
    not_to_confuse_with: Currency.
    international_alignment: OCDS item unit.
  item_lot_ref:
    definition: Link from an item to its lot.
    cardinality: zero_or_one_per_item
    when_populated: When lot structure applies.
    not_to_confuse_with: Source lot code itself.
    international_alignment: Relational lot-item linkage.
  classifications:
    definition: Typed source or governed taxonomy classifications attached to an item.
    cardinality: zero_or_many
    when_populated: When UNSPSC, CPV or governed taxonomy references exist.
    not_to_confuse_with: Free-text description.
    international_alignment: OCDS classification model.
  notices:
    definition: Publications about a procurement process.
    cardinality: zero_or_many
    when_populated: Whenever an actual publication is observed.
    not_to_confuse_with: Procurement process or planned publication milestone.
    international_alignment: eForms notice/procedure separation.
  notice_id:
    definition: Identity of a particular notice publication.
    cardinality: zero_or_one_per_notice
    when_populated: When source exposes one.
    not_to_confuse_with: Tender/process reference.
    international_alignment: eForms Notice Identifier.
  notice_type:
    definition: Semantic publication type such as tender notice or corrigendum.
    cardinality: one_per_notice
    when_populated: For every notice.
    not_to_confuse_with: Event type or procurement method.
    international_alignment: eForms/OCDS publication taxonomy.
  notice_version:
    definition: Version/revision of the same notice publication.
    cardinality: zero_or_one_per_notice
    when_populated: When source versions notices.
    not_to_confuse_with: Record revision or re-tender sequence.
    international_alignment: eForms Notice Version Identifier.
  notice_published_at:
    definition: Date/time the notice became publicly available.
    cardinality: zero_or_one_per_notice
    when_populated: When known.
    not_to_confuse_with: Expected publication milestone.
    international_alignment: Publication metadata.
  notice_source_system:
    definition: Publishing portal/system for the notice.
    cardinality: one_per_notice
    when_populated: For every notice.
    not_to_confuse_with: Procuring entity.
    international_alignment: Publication provenance.
  notice_source_locator:
    definition: URL/file/source locator for the notice.
    cardinality: zero_or_one_per_notice
    when_populated: When technically available.
    not_to_confuse_with: Submission channel.
    international_alignment: Publication provenance.
  milestones:
    definition: Typed scheduled/actual dates for procurement lifecycle points.
    cardinality: zero_or_many
    when_populated: Whenever a material lifecycle date is observed.
    not_to_confuse_with: Events or notices.
    international_alignment: OCDS milestones.
  procurement_document_ready:
    definition: Planned or achieved date when bidding/procurement documents or justification are ready for the next procurement step.
    cardinality: zero_or_many_by_process_or_lot_scope
    when_populated: When an authoritative plan separately schedules document readiness.
    not_to_confuse_with: Public issue/sale/download of tender documents or notice publication.
    international_alignment: World Bank Draft Bidding Document / Justification milestone.
  expected_publication:
