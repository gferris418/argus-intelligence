derived_fields:
  extension_count:
    do_not_store: true
    derive_from: COUNT(events where event_type == DEADLINE_EXTENSION)
  validity_extension_count:
    do_not_store: true
    derive_from: COUNT(events where event_type == VALIDITY_EXTENSION)
  variation_count:
    do_not_store: true
    derive_from: COUNT(implementation.modifications)
  current_submission_deadline:
    do_not_store_as_duplicate_when_milestone_exists: true
    derive_from: current milestone where milestone_type == SUBMISSION_DEADLINE
  current_opening_at:
    do_not_store_as_duplicate_when_milestone_exists: true
    derive_from: current milestone where milestone_type == OPENING

validation_rules:
  - PROCUREMENT_DOCUMENT_READY is a milestone and does not imply bidding documents were publicly issued.
  - EXPECTED_PUBLICATION is a planning milestone and does not create a notice until actual publication evidence exists.
  - When a notice is published, preserve the planned milestone and add the actual notice/publication evidence.
  - A probable reissue/retender relationship remains qualified as inference until authoritative evidence establishes the event.
  - Unknown or unobserved fields remain absent or explicitly unknown; schema completeness must never fabricate facts.

source_mapping_rule: >-
  Source-specific Bangladesh and development-partner labels must map to these semantic concepts.
  A new canonical field is created only when the source exposes a genuinely different real-world concept,
  not merely a different label or portal layout.

compatibility:
  current_v1_3_records_remain_readable: true
  candidate_is_not_active_write_schema: true
  migration_map: profiles/bangladesh-procurement-v1-to-v2-migration.yaml
  machine_write_contract: schemas/bangladesh-procurement-v2.schema.json
  live_record_migration: DEFERRED
  no_new_master_registry_record_type: true
