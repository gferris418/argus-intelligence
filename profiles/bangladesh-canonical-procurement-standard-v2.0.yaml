document_id: ARGUS-BD-PROC-STD-002
version: 2.0.0
status: CANDIDATE
country: Bangladesh
country_code: BD
supersedes_after_migration:
  - profiles/bangladesh-data-standard.yaml
  - profiles/bangladesh-canonical-procurement-standard-v1.1.yaml
  - profiles/bangladesh-canonical-procurement-standard-v1.2.yaml
  - profiles/bangladesh-canonical-procurement-standard-v1.3.yaml
purpose: >-
  Define a semantically deduplicated Bangladesh public-procurement data model that works
  across ministries, divisions, departments, directorates, authorities, SOEs, local bodies,
  defence/DGDP, PPP procurement and development-partner procurement. One real-world concept
  has one canonical home. Source-specific labels are preserved as evidence, not duplicated as
  new canonical fields.

international_alignment:
  OCDS:
    principle: contracting_process_lifecycle
    reference: Open Contracting Data Standard 1.1.5
    adopted_concepts: [parties, tender_process, items, awards, contracts, implementation, milestones]
  EU_EFORMS:
    principle: distinguish_procedure_notice_version_and_lot_identity
    adopted_concepts: [procedure_identity, notice_identity, notice_version, lot_identity]
  UNCITRAL:
    principle: transparent_objective_competitive_procurement
    adopted_concepts: [competition, participation, integrity, transparency]
  WORLD_BANK:
    principle: separate_strategy_plan_procurement_activity_and_contract_management
    adopted_concepts: [planning, review_control, procurement_process, contract_management]

semantic_principles:
  - One real-world concept has one canonical home.
  - Store source labels and raw values in observations; do not create portal-specific canonical fields.
  - Canonical ENTITY, PROJECT, SUPPLIER_PRODUCT, KNOWLEDGE and OPPORTUNITY data are referenced, not copied into each PROCUREMENT record.
  - A procurement record stores typed party-role links instead of repeating ministry, division, organization, PE and end-user names.
  - Different identifier types never substitute for one another even when their string values match.
  - A notice is a publication about a procurement process; it is not the procurement process itself.
  - A milestone represents a scheduled or achieved point in time; an event represents something that happened or changed.
  - Original and current dates are represented by milestone history and events, not duplicate scalar fields.
  - Counts that can be calculated from canonical arrays are derived and are not stored as authoritative facts.
  - Award and contract are different lifecycle objects. A contract number belongs to the contract, not the award.
  - Budget allocation and financing source/instrument are different concepts.
  - Procurement category, competition scope, selection method and procedure configuration are different concepts.
  - Missing information remains absent or explicitly unknown; source-template expectations never fabricate values.
  - Every material value is traceable to an observation/evidence source.

storage_boundary:
  registry_record_types_changed: false
  procurement_record_type: PROCUREMENT
  linked_record_types: [ENTITY, PROJECT, INTELLIGENCE, OPPORTUNITY, SUPPLIER_PRODUCT, KNOWLEDGE]
  raw_source_documents_in_github: prohibited
  live_record_migration: DEFERRED

structured_types:
  typed_identifier:
    fields: [scheme, value, scope, source_system, source_label]
  related_record_ref:
    fields: [argus_id, relation_type]
  party_role_link:
    fields: [party_id, role, source_role_label, unit_label, effective_from, effective_to]
  budget:
    fields: [type, fiscal_year, amount, currency, line_reference]
  financing:
    fields: [source_party_id, instrument, reference, amount, currency, commitment_date, status, conditions, scope]
  process:
    fields: [route, category, method_normalized, method_source_code, method_source_label, competition_scope, configuration, review_type, prequalification_required, framework_agreement, status_raw, status_normalized, estimated_value, currency]
  lot:
    fields: [lot_id, lot_reference, title, description, estimated_value, currency, delivery_location]
  item:
    fields: [item_id, description, quantity, unit, lot_ref, classifications]
  notice:
    fields: [notice_id, notice_type, version, published_at, source_system, source_locator]
  milestone:
    fields: [milestone_id, type, due_at, original_due_at, date_met, date_modified, status, lot_ref, source_ref]
  event:
    fields: [event_id, type, occurred_at, notice_ref, reason_raw, changes, source_ref]
  requirement:
    fields: [requirement_id, type, text, normalized_value, mandatory, scope, lot_ref, source_ref]
  fee:
    fields: [fee_id, type, amount, currency, raw_text, refundable, lot_ref, source_ref]
  security:
    fields: [security_id, type, amount, currency, raw_text, validity_until, lot_ref, source_ref]
  contact_point:
    fields: [contact_id, party_id, purpose, name, designation, address, email, phone, source_ref]
  award:
    fields: [award_id, award_date, status, supplier_party_ids, lot_refs, value, currency, approval_reference, financing]
  contract:
    fields: [contract_id, contract_number, award_ref, supplier_party_ids, value, currency, signed_at, period_start, period_end, status]
  implementation:
    fields: [status, progress_pct, actual_completion_date, current_value, currency, milestones, transactions, modifications]
  observation:
    fields: [observation_id, field_path, value, raw_label, raw_value, source_id, source_system, source_locator, observed_at, published_at, claim_type, condition, assurance]
  intelligence:
    fields: [maturity, activation_mode, commercial_fit, supplier_discovery_state, material_unknowns, research_frontier, next_action]

role_vocabularies:
  party_roles:
    - SPONSORING_MINISTRY
    - PARENT_DIVISION
    - IMPLEMENTING_AGENCY
    - BUYER
    - PROCURING_ENTITY
    - PROCUREMENT_AGENT
    - PROCUREMENT_UNIT
    - END_USER
    - PROJECT_OFFICE
    - APPROVING_AUTHORITY
    - FUNDER
    - REGULATOR
    - TENDERER
    - SUPPLIER
  process_categories: [GOODS, WORKS, CONSULTING_SERVICES, NON_CONSULTING_SERVICES]
  method_normalized: [OPEN, SELECTIVE, LIMITED, DIRECT, OTHER]
  competition_scope: [NATIONAL, INTERNATIONAL, RESTRICTED_BY_FINANCING, OTHER]
  configurations: [ONE_STAGE_ONE_ENVELOPE, ONE_STAGE_TWO_ENVELOPE, TWO_STAGE, TWO_STAGE_TWO_ENVELOPE, OTHER]
  requirement_types:
    - REGISTRATION
    - ENLISTMENT
    - LEGAL
    - EXPERIENCE
    - FINANCIAL_CAPACITY
    - TECHNICAL_CAPABILITY
    - OEM_AUTHORIZATION
    - SOURCE_COUNTRY
    - LOCAL_PARTICIPATION
    - JV_REQUIREMENT
    - STANDARD_CERTIFICATION
    - SUSTAINABILITY
    - SECURITY_CLEARANCE
    - OTHER
  milestone_types:
    - DOCUMENT_SALE_START
    - DOCUMENT_SALE_END
    - PREBID_MEETING
    - CLARIFICATION_DEADLINE
    - SECURITY_DEADLINE
    - SUBMISSION_DEADLINE
    - OPENING
    - VALIDITY_END
    - SECURITY_VALIDITY_END
    - EVALUATION_COMPLETE
    - EXPECTED_AWARD
    - CONTRACT_SIGNING
    - DELIVERY
    - COMPLETION
  event_types:
    - PUBLICATION
    - CORRIGENDUM
    - ADDENDUM
    - CLARIFICATION
    - DEADLINE_EXTENSION
    - OPENING_DATE_CHANGE
    - VALIDITY_EXTENSION
    - SECURITY_VALIDITY_EXTENSION
    - CANCELLATION
    - RETENDER
    - REISSUE
    - AWARD
    - CONTRACT_SIGNING
  fee_types: [TENDER_DOCUMENT, SCHEDULE_PURCHASE, OTHER]
  security_types: [TENDER_SECURITY, PERFORMANCE_SECURITY, ADVANCE_PAYMENT_GUARANTEE, RETENTION, OTHER]

field_dictionary:
  argus_id:
    definition: Permanent ARGUS identifier for this PROCUREMENT record/process cycle.
    cardinality: one
    when_populated: Always for a canonical PROCUREMENT record.
    not_to_confuse_with: External tender ID, tender reference, package number or requirement identity.
    international_alignment: Internal analogue of a stable contracting-process record identifier.
  requirement_ref:
    definition: Stable reference to the underlying commercial/mission need shared across planning, tender and re-tender cycles.
    cardinality: zero_or_one
    when_populated: When reconciliation establishes the underlying requirement lineage.
    not_to_confuse_with: Procurement record ID or project ID.
    international_alignment: ARGUS lineage extension beyond a single contracting process.
  title:
    definition: Normalized human-readable title of this procurement process cycle.
    cardinality: one
    when_populated: When any reliable title or item description is available.
    not_to_confuse_with: Source notice title, package title or project title.
    international_alignment: OCDS tender/title concept.
  description:
    definition: Concise normalized description of the procurement scope.
    cardinality: zero_or_one
    when_populated: When scope detail beyond the title is available.
    not_to_confuse_with: Raw source wording retained in observations.
    international_alignment: OCDS tender/description concept.
  record_state:
    definition: State of the ARGUS data record itself, such as current, superseded or archived.
    cardinality: one
    when_populated: Always.
    not_to_confuse_with: Procurement process status or contract status.
    international_alignment: Internal data-governance field.
  record_revision:
    definition: Monotonic revision of the ARGUS canonical record.
    cardinality: one
    when_populated: Always.
    not_to_confuse_with: Notice version, corrigendum number or project revision.
    international_alignment: Internal data-governance field.
  identifiers:
    definition: Typed identifiers attached to the procurement or linked planning context.
    cardinality: zero_or_many
    when_populated: Whenever a source publishes a typed identifier.
    not_to_confuse_with: Aliases; each identifier retains its scheme and semantic scope.
    international_alignment: OCDS/EU eForms principle of distinct identifiers.
  related_record_refs:
    definition: Links to canonical ENTITY, PROJECT, OPPORTUNITY, SUPPLIER_PRODUCT, INTELLIGENCE or KNOWLEDGE records.
    cardinality: zero_or_many
    when_populated: When the procurement is reconciled to another canonical record.
    not_to_confuse_with: Copying linked-record attributes into the procurement.
    international_alignment: Relational normalization best practice.
  party_role_links:
    definition: Links canonical parties to the role they perform in this procurement.
    cardinality: one_or_many
    when_populated: When institutional roles are evidenced.
    not_to_confuse_with: Government hierarchy, which remains on ENTITY relationships.
    international_alignment: OCDS parties and roles.
  party_id:
    definition: Canonical ENTITY identifier of an organization/person participating in the procurement.
    cardinality: one_per_role_link
    when_populated: For each party-role link.
    not_to_confuse_with: PE code or supplier source-system ID.
    international_alignment: OCDS organization identifier linkage.
  party_role:
    definition: Functional role performed by the linked party in this procurement.
    cardinality: one_per_role_link
    when_populated: For each party-role link.
    not_to_confuse_with: Organization type or parent hierarchy.
    international_alignment: OCDS party roles localized for Bangladesh.
  unit_label:
    definition: Source-published procurement wing, section, cell or unit below the canonical party when a separate ENTITY is not justified.
    cardinality: zero_or_one_per_role_link
    when_populated: When a notice names an operational unit such as Navy Wing or NP-8.
    not_to_confuse_with: Procuring-entity organization identity.
    international_alignment: Local extension for organizational subunits.
  budget_type:
    definition: Bangladesh budget classification applying to the procurement-specific budget allocation.
    cardinality: zero_or_one
    when_populated: When Revenue, Development, Own Fund or equivalent is stated.
    not_to_confuse_with: Financing instrument or financier identity.
    international_alignment: Local fiscal-classification extension.
  budget_fiscal_year:
    definition: Fiscal year of the procurement-specific budget allocation.
    cardinality: zero_or_one
    when_populated: When the budget allocation is tied to a fiscal year.
    not_to_confuse_with: APP fiscal year if they differ.
    international_alignment: Local fiscal-classification extension.
  budget_amount:
    definition: Amount allocated in the applicable budget specifically to this procurement when evidenced.
    cardinality: zero_or_one
    when_populated: Only when a procurement-specific allocation is published.
    not_to_confuse_with: Project total cost, estimated procurement value or contract value.
    international_alignment: OCDS planning/budget concept.
  budget_currency:
    definition: Currency of budget_amount.
    cardinality: zero_or_one
    when_populated: When budget_amount exists.
    not_to_confuse_with: Procurement estimate or contract currency.
    international_alignment: OCDS value/currency pattern.
  budget_line_reference:
    definition: Budget line, economic code or allocation reference tied to the procurement.
    cardinality: zero_or_one
    when_populated: When published.
    not_to_confuse_with: Package, APP or project identifier.
    international_alignment: Local fiscal reference.
  financing_entries:
    definition: Structured funding contributions/instruments applicable to this procurement or linked project scope.
    cardinality: zero_or_many
    when_populated: When a source identifies GoB, loan, credit, grant, G2G, own-fund or other financing.
    not_to_confuse_with: Budget classification.
    international_alignment: World Bank/IFI financing-reference practice.
  financing_source_party_id:
    definition: Canonical party supplying the finance, such as GoB, World Bank, ADB, JICA or AIIB.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When the financier is identified.
    not_to_confuse_with: Procuring entity or implementing agency.
    international_alignment: Party-based financier representation.
  financing_instrument:
    definition: Legal/economic form of finance, such as government allocation, loan, credit, grant, own fund or G2G.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When the financing instrument is known.
    not_to_confuse_with: Budget type.
    international_alignment: IFI financing semantics.
  financing_reference:
    definition: Typed loan, credit, grant or financing-agreement reference.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When published.
    not_to_confuse_with: Project code, tender reference or package number.
    international_alignment: World Bank/ADB/JICA financing reference.
  financing_amount:
    definition: Amount contributed by this financing entry.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When contribution amount is available.
    not_to_confuse_with: Total project cost or award value.
    international_alignment: Financial contribution value.
  financing_currency:
    definition: Currency of financing_amount.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When financing_amount exists.
    not_to_confuse_with: Contract currency.
    international_alignment: Value/currency pattern.
  financing_commitment_date:
    definition: Date the financing commitment/agreement became formally committed when evidenced.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When stated by authoritative financing evidence.
    not_to_confuse_with: Procurement-plan date or project approval date.
    international_alignment: IFI financing lifecycle.
  financing_status:
    definition: Current state of the financing entry, such as proposed, approved, signed, effective or disbursing.
    cardinality: zero_or_one_per_financing_entry
    when_populated: When financing maturity is evidenced.
    not_to_confuse_with: Project or procurement status.
    international_alignment: IFI financing lifecycle.
  financing_conditions:
    definition: Procurement/source-country or other conditions imposed by the financing instrument.
    cardinality: zero_or_many_per_financing_entry
    when_populated: When tied, untied, eligible-country or equivalent conditions are stated.
    not_to_confuse_with: General tender eligibility requirements.
    international_alignment: Bilateral/IFI financing conditions.
  process_route:
    definition: ARGUS Bangladesh acquisition-route classification, such as general e-GP, GoB development, DGDP or development-partner route.
    cardinality: zero_or_one
    when_populated: After route classification is supported.
    not_to_confuse_with: Competition scope or procurement method.
    international_alignment: ARGUS Bangladesh contextual classification.
  process_category:
    definition: What is being procured at the top level: goods, works, consulting services or non-consulting services.
    cardinality: zero_or_one
    when_populated: When source nature/category is known.
    not_to_confuse_with: Procurement method or market competition scope.
    international_alignment: OCDS mainProcurementCategory concept.
  process_method_normalized:
    definition: Internationally normalized supplier-selection method: open, selective, limited, direct or other.
    cardinality: zero_or_one
    when_populated: When the source procurement method is known.
    not_to_confuse_with: Source code OTM/LTM/RFQ/DPM, NCT/ICT or envelope configuration.
    international_alignment: OCDS procurementMethod codelist.
  process_method_source_code:
    definition: Exact source-system procurement-method code such as OTM, LTM, RFQ or DPM.
    cardinality: zero_or_one
    when_populated: When a source code exists.
    not_to_confuse_with: Normalized method.
    international_alignment: Local source preservation.
  process_method_source_label:
    definition: Exact source-published procurement-method label.
    cardinality: zero_or_one
    when_populated: When available.
    not_to_confuse_with: Normalized method.
    international_alignment: Source-label preservation.
  process_competition_scope:
    definition: Market scope/eligibility of competition, such as national, international or financing-restricted.
    cardinality: zero_or_one
    when_populated: When NCT/ICT or equivalent market scope is stated.
    not_to_confuse_with: Procurement method.
    international_alignment: Localized market-approach concept.
  process_configuration:
    definition: Structural procedure configuration, such as one-stage two-envelope or two-stage.
    cardinality: zero_or_one
    when_populated: When procedure structure is known.
    not_to_confuse_with: Method or competition scope.
    international_alignment: World Bank/IFI procurement-process configuration.
  process_review_type:
    definition: Financier review/control classification such as prior or post review.
    cardinality: zero_or_one
    when_populated: For development-partner procurements where stated.
    not_to_confuse_with: Method, process configuration or approval status.
    international_alignment: World Bank/ADB review control.
  process_prequalification_required:
    definition: Whether formal prequalification/preselection is required.
    cardinality: zero_or_one
    when_populated: When explicitly stated.
    not_to_confuse_with: General eligibility criteria.
    international_alignment: OCDS pre-qualification mapping and IFI practice.
  process_framework_agreement:
    definition: Whether the procurement establishes/uses a framework agreement.
    cardinality: zero_or_one
    when_populated: When explicitly identified.
    not_to_confuse_with: Multi-lot procurement.
    international_alignment: UNCITRAL/OCDS framework-agreement concept.
  process_status_raw:
    definition: Exact current procurement-process status text from the authoritative source.
    cardinality: zero_or_one_per_current_source
    when_populated: When the source publishes a status.
    not_to_confuse_with: ARGUS record_state or normalized process status.
    international_alignment: Source-status preservation.
  process_status_normalized:
    definition: ARGUS normalized current procurement-process state.
    cardinality: one
    when_populated: For every canonical process once enough evidence exists.
    not_to_confuse_with: Record state, project status or contract status.
    international_alignment: OCDS tender/status concept localized to ARGUS.
  process_estimated_value:
    definition: Pre-award estimated value of the procurement process/package.
    cardinality: zero_or_one
    when_populated: When an authoritative estimate is available.
    not_to_confuse_with: Budget allocation, award value or contract current value.
    international_alignment: OCDS tender/value concept.
  process_currency:
    definition: Currency of process_estimated_value.
    cardinality: zero_or_one
    when_populated: When process_estimated_value exists.
    not_to_confuse_with: Tender currency basis or contract currency.
    international_alignment: OCDS value/currency pattern.
  identifiers_scheme:
    definition: Semantic type/scheme of an external identifier, e.g. BD_PROJECT_CODE, EGP_APP_ID, EGP_TENDER_ID, TENDER_REFERENCE_NO, PACKAGE_NO, LOAN_REFERENCE.
    cardinality: one_per_identifier
    when_populated: For every identifier entry.
    not_to_confuse_with: Source label alone.
    international_alignment: Typed-identifier practice aligned with eForms procedure/notice separation.
  identifiers_value:
    definition: Exact identifier value preserved as a string.
    cardinality: one_per_identifier
    when_populated: For every identifier entry.
    not_to_confuse_with: Another identifier type even when the string matches.
    international_alignment: Stable identifier practice.
  identifiers_scope:
    definition: Object/lifecycle scope the identifier identifies, such as PROJECT, PLAN, PACKAGE, PROCESS, NOTICE, AWARD or CONTRACT.
    cardinality: one_per_identifier
    when_populated: For every identifier entry.
    not_to_confuse_with: Identifier scheme.
    international_alignment: Relational identifier scoping.
  lots:
    definition: Array of separately identifiable lots within one procurement process.
    cardinality: zero_or_many
    when_populated: When the source defines lots.
    not_to_confuse_with: Package identifiers or procurement-process identity.
    international_alignment: EU eForms lot model and OCDS lot extensions/practice.
  lot_id:
    definition: Source-published lot sequence/identifier, usually numeric or short code.
    cardinality: one_per_lot
    when_populated: For each lot.
    not_to_confuse_with: Package number, tender reference or lot_reference.
    international_alignment: EU eForms lot identifier.
  lot_reference:
    definition: Additional published lot code/identification such as WD-2 when distinct from lot_id.
    cardinality: zero_or_one_per_lot
    when_populated: When a source provides a separate lot identification label/code.
    not_to_confuse_with: Package number.
    international_alignment: Localized lot reference.
  lot_title:
    definition: Human-readable lot title.
    cardinality: zero_or_one_per_lot
    when_populated: When published or safely normalized.
    not_to_confuse_with: Process title.
    international_alignment: eForms/OCDS lot title semantics.
  lot_description:
    definition: Additional scope description specific to the lot.
    cardinality: zero_or_one_per_lot
    when_populated: When available.
    not_to_confuse_with: Item-level descriptions.
    international_alignment: Lot description semantics.
  lot_estimated_value:
    definition: Pre-award estimated value specific to the lot.
    cardinality: zero_or_one_per_lot
    when_populated: When explicitly published.
    not_to_confuse_with: Process total estimate or award value.
    international_alignment: eForms/OCDS lot value.
  lot_currency:
    definition: Currency of lot_estimated_value.
    cardinality: zero_or_one_per_lot
    when_populated: When lot_estimated_value exists.
    not_to_confuse_with: Process currency.
    international_alignment: Value/currency pattern.
  lot_delivery_location:
    definition: Delivery/performance location specific to a lot.
    cardinality: zero_or_many_per_lot
    when_populated: When published.
    not_to_confuse_with: Procuring-entity address.
    international_alignment: OCDS item/implementation location practice.
  items:
    definition: Goods, works or services line items being procured, with quantity and unit where available.
    cardinality: zero_or_many
    when_populated: When product/service line items can be identified.
    not_to_confuse_with: Lots; a lot can contain many items.
    international_alignment: OCDS items model.
  item_id:
    definition: Stable source/internal identifier for an item row within the process.
    cardinality: one_per_item
    when_populated: For each structured item.
    not_to_confuse_with: Product taxonomy code.
    international_alignment: OCDS item id.
  item_description:
    definition: Description of the good, work or service line item.
    cardinality: one_per_item
    when_populated: For each structured item.
    not_to_confuse_with: Process or lot title.
    international_alignment: OCDS item description.
  item_quantity:
    definition: Numeric quantity of the item where meaningful.
    cardinality: zero_or_one_per_item
    when_populated: When a quantity is stated.
    not_to_confuse_with: Lot count.
    international_alignment: OCDS item quantity.
  item_unit:
    definition: Unit of measure applying to item_quantity.
    cardinality: zero_or_one_per_item
    when_populated: When quantity is stated.
    not_to_confuse_with: Currency.
    international_alignment: OCDS unit concept.
  item_lot_ref:
    definition: Reference linking the item to a lot when the process is lot-structured.
    cardinality: zero_or_one_per_item
    when_populated: When applicable.
    not_to_confuse_with: Lot identifier source value itself.
    international_alignment: Relational lot-item linkage.
  classifications:
    definition: Typed source or governed taxonomy classifications attached to a process/item.
    cardinality: zero_or_many
    when_populated: When UNSPSC, CPV, BPPA category or ATLAS taxonomy references exist.
    not_to_confuse_with: Free-text item description.
    international_alignment: OCDS classification model.
  notices:
    definition: Publications about the procurement process, including planning, tender, corrigendum, award and re-tender notices.
    cardinality: zero_or_many
    when_populated: Whenever a notice/publication is observed.
    not_to_confuse_with: The procurement process itself.
    international_alignment: EU eForms notice/procedure separation.
  notice_id:
    definition: Identifier of a particular published notice when the source exposes one.
    cardinality: zero_or_one_per_notice
    when_populated: When available.
    not_to_confuse_with: Process/tender reference or portal tender ID.
    international_alignment: EU eForms Notice Identifier.
  notice_type:
    definition: Semantic publication type, such as planning notice, tender notice, corrigendum, award notice or re-tender notice.
    cardinality: one_per_notice
    when_populated: For every structured notice.
    not_to_confuse_with: Procurement method or event type.
    international_alignment: eForms notice taxonomy / OCDS document context.
  notice_version:
    definition: Version/revision of the same notice publication where the source supports versioning.
    cardinality: zero_or_one_per_notice
    when_populated: When explicitly available.
    not_to_confuse_with: ARGUS record revision or procurement re-tender sequence.
    international_alignment: EU eForms Notice Version Identifier.
  notice_published_at:
    definition: Date/time the notice became publicly available.
    cardinality: zero_or_one_per_notice
    when_populated: When publication time/date is known.
    not_to_confuse_with: Event occurrence date when different.
    international_alignment: OCDS/eForms publication metadata.
  notice_source_system:
