schema_version: 2
id: argus.atlas-alignment.collection-gate-v3
status: CANDIDATE
argus_version: 2.2.0-rc.2
relationship: nested_intelligence_collection_subsystem

atlas_contract:
  activation_authority: ATLAS_OS
  activation_gate: COLLECTION_NEED_GATE
  collection_modes: [ARGUS_COLLECTION, HYBRID]
  capability: intelligence_collection
  activation_contract: contracts/atlas/argus-activation-v1.json
  domain_context_contract: contracts/atlas/domain-context-handoff-v1.schema.json
  execution_lease_contract: contracts/atlas/execution-lease-v1.schema.json
  return_correlation_required: true

routing:
  first_semantic_work: ATLAS_INTENT_AND_TARGET_INTERPRETATION
  collection_gate: ATLAS_COLLECTION_NEED_GATE
  modes:
    NONE: No external collection is required.
    ATLAS_DIRECT: Ordinary research or retrieval remains in ATLAS.
    ARGUS_COLLECTION: ARGUS performs a bounded collection mission and returns evidence.
    HYBRID: ARGUS collects while ATLAS retains substantive analysis or decision work.
  government_mention_alone_activates_argus: false
  policy_analysis_alone_activates_argus: false
  named_commercial_target_can_create_collection_need: true
  buyer_product_or_procurement_target_can_create_collection_need: true

handoff:
  accepted_states: [READY, PARTIAL]
  partial_semantics: ARGUS_ENRICHES_COLLECTION_CONTEXT
  blocked_state: REJECT_DEPENDENT_EXECUTION
  atlas_owned_context_is_preserved: true
  material_upstream_change_requires_new_handoff: true
  argus_internal_collection_method: spec/collection-method.yaml
  argus_internal_collection_plan: schemas/collection-plan.schema.json

ownership:
  atlas:
    - mission_control
    - control_plane
    - intent_and_target_interpretation
    - collection_need_gate
    - plan_and_work_units
    - permissions_and_approvals
    - canonical_domain_context_and_taxonomy
    - evidence_governance
    - analysis_and_decision
    - assurance_and_verification
    - persistence_authorization
    - observability
    - dashboard_projection
    - final_delivery
  argus:
    - target_resolution
    - pir_and_eei_derivation_within_mission
    - collection_and_source_planning
    - source_discovery_and_acquisition
    - extraction_and_normalization
    - entity_event_relationship_resolution_and_deduplication
    - collection_side_classification_suggestions
    - evidence_grading_proposals
    - corroboration_and_source_reconciliation
    - competing_hypothesis_tracking
    - gap_conflict_and_coverage_assessment
    - collection_package

compatibility:
  historical_validated_atlas_baseline:
    version: 2.0.1
    commit: b8b8559c57eef5fbb97d914d924077ba20b1883d
  current_validated_atlas_candidate:
    version: 2.0.2-rc.5
    commit: 401a4ef030be77a2a5a635fa0ff50f538101b4e3
    control_revision: atlas-bootstrap-2026-10-22-r9
  current_change_requires_coordinated_atlas_candidate: true
  historical_alignment_companion: alignments/atlas-os.md
