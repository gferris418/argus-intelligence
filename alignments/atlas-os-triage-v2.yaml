schema_version: 3
id: argus.atlas-alignment.bounded-provider-v3
status: CANDIDATE
argus_version: 3.0.0-rc.2
relationship: atlas_governed_360_business_intelligence_playbook

atlas_contract:
  activation_authority: ATLAS
  next_step_authority: ATLAS
  provider_return_target: ATLAS
  explicit_user_approval_required: true
  approval_key: ARGUS_ACTIVATION
  capability: intelligence_collection
  provider: argus
  provider_field_semantics: compatibility_execution_handle_not_underlying_tool_provider
  current_integration: contracts/atlas/current-integration.yaml
  canonical_contract_repository: gferris418/atlas-os
  canonical_contract_path: contracts/atlas-argus-execution-v2.json
  canonical_contract_version: 2.0.0
  legacy_transport: contracts/atlas/synchronization-compatibility.yaml

routing:
  prompt_entry: MISSION_CONTROL_FIRST
  prompt_entry_scope: every_user_prompt_while_atlas_active
  first_semantic_work: ATLAS_UNDERSTAND_AND_NORMALIZE
  pre_execution_flow: [UNDERSTAND_AND_NORMALIZE, MINIMAL_DOMAIN_FRAMING, ROUTE]
  modes:
    NONE: No external collection is required.
    DIRECT_SEARCH: Ordinary current factual retrieval remains in ATLAS.
    ARGUS: ARGUS applies one bounded 360-degree business-intelligence mission and returns the package to ATLAS.
    MULTI_CAPABILITY: ARGUS applies intelligence doctrine while ATLAS retains analysis, comparison, forecast, scenario or decision work.
  government_mention_alone_activates_argus: false
  policy_analysis_alone_activates_argus: false
  tender_lookup_alone_activates_argus: false
  structured_collection_requires_argus: true

handoff:
  current_runtime_adapter: tools/atlas_v3_provider.py
  atlas_route_state_required: READY
  atlas_activation_approval_required: APPROVED
  atlas_owned_context_is_preserved: true
  result_return_target: ATLAS
  argus_internal_collection_method: spec/collection-method.yaml
  argus_internal_collection_plan: schemas/collection-plan.schema.json
  argus_business_intelligence_boundary: spec/business-intelligence-boundary.yaml
  legacy_signed_transport_status: backward_compatibility_only

ownership:
  atlas:
    - mission_control
    - control_plane
    - intent_and_target_interpretation
    - minimal_domain_framing
    - routing
    - permissions_and_approvals
    - capability_provider_selection_and_authorization
    - evidence_governance
    - analysis_and_decision
    - assurance_and_verification
    - persistence_authorization
    - observability
    - dashboard_projection
    - final_delivery
    - every_next_step_after_provider_return
  argus:
    - business_intelligence_doctrine
    - target_resolution
    - pir_and_eei_derivation_within_mission
    - collection_and_source_planning
    - source_discovery_and_acquisition
    - extraction_and_normalization
    - entity_event_relationship_resolution_and_deduplication
    - collection_side_classification_suggestions
    - evidence_grading_proposals
    - corroboration_and_source_reconciliation
    - competing_hypothesis_tracking
    - gap_conflict_and_coverage_assessment
    - demand_supply_opportunity_and_stakeholder_intelligence
    - competitor_market_partnerability_and_procurement_intelligence
    - post_award_and_commercial_performance_intelligence
    - intelligence_learning_and_calibration
    - collection_package

compatibility:
  historical_validated_atlas_baseline:
    version: 2.0.1
    commit: b8b8559c57eef5fbb97d914d924077ba20b1883d
  current_validated_atlas:
    version: 3.0.2
    commit: 2972f272026d2cf41e5dd847eb939d3579d8520a
    control_revision: chatgpt-plugin-bootstrap-v1.0.1
    execution_contract_version: 2.0.0
  current_change_requires_coordinated_atlas_candidate: false
  historical_alignment_companion: alignments/atlas-os.md
