  one_million_scale:
    status: NOT_RUN_CAPACITY_LIMIT
    rationale: >-
      At roughly 100k rows the three primary ARGUS tables already use about 84 MB
      before indexes, while the listed major indexes add substantial additional
      storage. Linear extrapolation exceeds the project's 1 GiB branch logical-size
      limit before allowing for all indexes, WAL/working space, or concurrent writes.
      The required 1M test therefore needs a larger-capacity benchmark environment.

