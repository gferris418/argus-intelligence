  claim_conditions: [CURRENT, STALE, CONFLICT]
  atlas_assurance_is_independent: true
  evidence_confidence_is_not_procurement_probability: true
  procurement_probability_is_not_success_probability: true
  supplier_match_confidence_is_separate: true

decision_boundary:
