  supplier_match_contract: schemas/opportunity-supplier-match.schema.json
  event_contract: schemas/opportunity-event.schema.json
  final_user_output_owner: ATLAS OS
  may_report_collection_coverage: true
  may_report_collection_gaps: true
  may_report_opportunity_qualification: true
  may_report_supplier_matches: true
  may_make_final_business_decision: false

