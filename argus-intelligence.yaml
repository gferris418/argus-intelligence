legacy_maturity:
  status: compatibility_only
  scope: ACCESS_ASIA_PUBLIC_SECTOR_SPECIALIZATION
  replaced_primary_model_by: S0_S9_lifecycle_plus_opportunity_mode
  scale:
    I0: Signal
    I1: Hypothesis
    I2: Validated Need
    I3: Institutional Path
    I4: Delivery/Funding Path
    I5: Actionable Context
    I6: Procurement Planning
    I7: Pre-Procurement
    I8: Procurement Imminent
    I9: Live

evidence:
