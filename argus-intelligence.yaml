  atlas_execution_lease_contract: contracts/atlas/execution-lease-v1.schema.json
  atlas_signing_key_registry_contract: contracts/atlas/signing-key-registry-v1.schema.json
  atlas_activation_contract: contracts/atlas/argus-activation-v1.json
  atlas_synchronization_compatibility: contracts/atlas/synchronization-compatibility.yaml
  atlas_synchronization_receipt_schema: schemas/atlas-argus-sync-receipt.schema.json
  synchronization_runtime: tools/atlas_sync.py
  analysis_runtime: tools/argus_runtime.py

scope:
  primary: ATLAS-governed government commercial opportunity intelligence
  mission: >-
    Identify, develop, qualify and track legitimate government-linked commercial
    opportunities as early as observable, while simultaneously identifying and
    assessing international OEMs, suppliers, solution providers and contractors
    capable of meeting the need with Access Asia positioned as a legitimate local
    commercial partner where appropriate.
  principle: Tender intelligence is one subsystem; ARGUS should preferably know the opportunity before tender publication.
  demand_intelligence: policy, need, programme, project, budget, approval, procurement and installed-base intelligence
  supply_intelligence: OEM, supplier, contractor, technology, product, capability, reference and partnerability intelligence
  opportunity_engine: demand-supply reconciliation around a persistent commercial opportunity object
  specializations:
    - government_public_sector_opportunity_intelligence
    - target_intelligence
    - procurement_intelligence
    - supplier_competitor_collection
    - stakeholder_collection
    - installed_base_collection
    - market_landscape_collection
    - monitoring_collection
  access_asia_principle: Access Asia shall not wait for a tender to define an opportunity.

production_runtime:
  access_asia:
    governance_backbone: ATLAS OS
    atlas_change_required: false
    standalone_argus: false
  standalone_mode:
    permitted_for: [portability, testing, recovery, non_access_asia_implementation]

atlas_compatibility:
  last_validated_base: 3.0.1
  last_validated_base_commit: 7ff95f5c96685ec4e7ed7b1eb6fea0821e7e2abc
  last_validated_control_revision: chatgpt-plugin-bootstrap-v1
  required_next_target: null
  relationship: bounded_intelligence_collection_provider
  activation_authority: ATLAS
  next_step_authority: ATLAS
  provider_return_target: ATLAS
  explicit_user_approval_required: true
  activation_capability: intelligence_collection
  provider: argus
  approval_key: ARGUS_ACTIVATION
  current_integration_contract: contracts/atlas/current-integration.yaml
  current_provider_runtime: tools/atlas_v3_provider.py
  rule: >-
    ATLAS owns Mission Control, Control Plane, preprocessing, routing, approvals,
    evidence acceptance, authoritative commercial priority, pursuit decisions,
    persistence, observability, Dashboard, every next step after provider return,
    verification and delivery. ARGUS owns only the authorized bounded intelligence
    mission and returns its collection package to ATLAS.
  keyword_activation: false
  background_activation: false
  creates_execution_spine: false
  owns_planning: false
  owns_approvals: false
  owns_final_business_decision: false
  legacy_signed_transport:
    status: backward_compatibility_only
    descriptor: contracts/atlas/synchronization-compatibility.yaml
    handoff_contract_version: 1.2.0
    execution_lease_contract_version: 1.0.0
    signing_key_registry_contract_version: 1.0.0
    replay_and_stale_result_protection: enforced
    action_authorization_binding: enforced
    control_record_authenticity: detached_ed25519_lifecycle_governed_key_registry

engines:
  demand_intelligence:
    status: active
  supply_intelligence:
    status: active
  opportunity_engine:
    status: active
  matching_and_qualification:
    status: active
  early_warning:
    status: active

opportunity_model:
  primary_commercial_object: OPPORTUNITY
  early_identity_pattern: ARGUS-OPP-YYYY-NNNNNN
  early_identity_before_px: true
  commercial_identity_requires_atlas_promotion: true
  lifecycle_stages: [S0, S1, S2, S3, S4, S5, S6, S7, S8, S9]
  modes: [SHAPE, POSITION, REACT, EXPAND]
  tender_does_not_create_new_opportunity_by_default: true
  multiple_procurements_per_opportunity_allowed: true

bangladesh_w_question_contract:
  purpose: documentation_completeness_lens_not_state_machine
  missing_semantics: use_NOT_APPLICABLE_only_when_dimension_is_genuinely_irrelevant
  dimensions:
    who:
      meaning: actors_owners_authorities_beneficiaries_influencers_counterparties
    what:
      meaning: exact_concept_object_action_state_or_event
    when:
      meaning: effective_dates_triggers_lifecycle_position_entry_exit_conditions
    where:
      meaning: jurisdiction_institution_administrative_level_source_system_project_package_scope
    why:
      meaning: purpose_and_government_or_commercial_significance
    which:
      meaning: applicable_route_alternative_method_subtype_authority_or_option
    how:
      meaning: process_transitions_dependencies_reconciliation_or_calculation
    how_much_or_many:
      meaning: amount_quantity_threshold_duration_count_or_scale_when_material
    evidence:
      meaning: provenance_observation_date_confidence_and_contradictions
    decision_impact:
      meaning: decision_effect_and_next_commercially_useful_action

operating_loop:
  - Contextualize
  - Resolve_Targets
  - Derive_PIR
  - Derive_EEI
  - Plan_Collection
  - Plan_Sources
  - Discover
  - Acquire
  - Extract
  - Normalize
  - Resolve_Entities_Events_Relationships
  - Deduplicate
  - Classify
  - Grade_Evidence
  - Corroborate
  - Competing_Hypotheses
  - Detect_Conflicts
  - Assess_Coverage_And_Gaps
  - Develop_Opportunity_Context
  - Build_Supplier_Universe
  - Match_And_Qualify
  - Package
  - Learn

continuous_search_learning:
  authority: spec/continuous-learning.yaml
  record_schema: schemas/research-learning-record.schema.json
  every_search_produces_learning_record: true
  no_result_searches_are_learning_events: true
  memory_types: [EPISODIC_MEMORY, SEMANTIC_MEMORY, STRATEGY_MEMORY, CALIBRATION_MEMORY, SOURCE_MEMORY, VOCABULARY_MEMORY]
  heuristic_states: [OBSERVED, REPEATED_PATTERN, VALIDATED_HEURISTIC]
  backtest_required_for_validated_heuristic: true
  learned_patterns_may_guide_collection: true
  learned_patterns_may_replace_current_evidence: false
  outcome_calibration_required: true
  unknown_means_research_task_not_stop: true
  atlas_persistence_authority_unchanged: true

360_intelligence_collection:
  doctrine: 360_degree_breadth_decision_driven_depth
  breadth: all_materially_relevant_lenses
  depth: decision_driven_by_research_frontier
  exhaustive_collection_required: false
  single_source_dependence_prohibited_when_material: true
  lenses: [need_mission, policy_strategy, institution_stakeholders, programme_project, budget_funding, procurement_acquisition, technical_installed_base, supplier_competitor, ecosystem_influence, commercial_participation, timing_triggers, internal_intelligence]
  coverage_states: [NOT_APPLICABLE, UNASSESSED, INSUFFICIENT, PARTIAL, ADEQUATE]
  stopping_rule: stop when additional collection is unlikely to change collection sufficiency, material uncertainty, supplier matching, opportunity qualification or the next ATLAS action

commercial_opportunity_intelligence:
  doctrine: spec/commercial-opportunity-intelligence.yaml
  demand_first_discovery: true
  supply_first_discovery: true
  opportunity_creation_path: legitimate_market_development_only
  rapid_tender_mode: true
  event_driven_early_warning: true
  supplier_partnerability_required: true
  separate_evidence_and_probability_measures: true
  detection_lag_kpi: true

bangladesh_standardization:
  canonical_data_standard: profiles/bangladesh-data-standard.yaml
  canonical_procurement_extension: profiles/bangladesh-canonical-procurement-standard-v1.3.yaml
  procurement_source_standard: profiles/bangladesh-procurement-source-standard-v1.0.yaml
  source_mappings: profiles/bangladesh-source-mappings.yaml
  extended_source_mappings: profiles/bangladesh-source-mappings-v1.3.yaml
  institution_standard: profiles/bangladesh-institution-standard.yaml
  pursuit_activation: profiles/bangladesh-pursuit-activation.yaml
  observation_schema: schemas/bangladesh-observation-v1.1.schema.json
  bangladesh_data_standard_version: 1.3.0
  bangladesh_procurement_standard_version: 1.3.0
  bangladesh_procurement_source_standard_version: 1.0.0
  development_partner_procurement_normalization: PASS
  egp_system_id_reference_no_separation: PASS
  institution_graph_normalization: PASS
  pursuit_activation_modes: PASS
  tender_extension_and_retender_events: PASS
  stage_aware_source_selection: PASS
  source_access_classification: PASS
  rule: Source-specific Bangladesh and development-partner labels normalize into one composed canonical field vocabulary before reconciliation and collection packaging; source selection is claim- and stage-aware rather than portal-first.

pursuit_activation:
  legacy_modes: [EARLY_REQUIREMENT_DEVELOPMENT, PLANNED_PROCUREMENT_CAPTURE, LIVE_TENDER_RESPONSE]
  canonical_modes: [SHAPE, POSITION, REACT, EXPAND]
  identity_rule: stage changes commercial action, not underlying opportunity identity
  supplier_engagement_can_begin_before_tender: true
  current_bangladesh_framework: PPR 2025

master_registry:
