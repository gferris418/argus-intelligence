schema_version: 2
product:
  id: argus-intelligence
  name: ARGUS Intelligence Collection
  version: 2.2.0-rc.1
  previous_version: 2.1.0-rc.1
  release_channel: candidate
  status: CANDIDATE
  classification: internal

authority:
  manifest: argus-intelligence.yaml
  core: spec/general-intelligence.yaml
  public_sector_opportunity_doctrine: spec/core.md
  atlas_alignment: alignments/atlas-os-triage-v2.yaml
  historical_atlas_alignment: alignments/atlas-os.md
  country_profiles:
    bangladesh: profiles/bangladesh.md
  bangladesh_data_standard: profiles/bangladesh-data-standard.yaml
  bangladesh_procurement_standard: profiles/bangladesh-canonical-procurement-standard-v1.3.yaml
  bangladesh_source_mappings: profiles/bangladesh-source-mappings.yaml
  bangladesh_extended_source_mappings: profiles/bangladesh-source-mappings-v1.3.yaml
  bangladesh_institution_standard: profiles/bangladesh-institution-standard.yaml
  bangladesh_pursuit_activation: profiles/bangladesh-pursuit-activation.yaml
  bangladesh_observation_schema: schemas/bangladesh-observation.schema.json
  bangladesh_observation_schema_v1_1: schemas/bangladesh-observation-v1.1.schema.json
  collection_mission_schema: schemas/collection-mission.schema.json
  collection_package_schema: schemas/intelligence-collection-package.schema.json
  domain_result_schema: schemas/domain-result.schema.json
  atlas_domain_context_contract: contracts/atlas/domain-context-handoff-v1.schema.json
  atlas_execution_lease_contract: contracts/atlas/execution-lease-v1.schema.json
  atlas_signing_key_registry_contract: contracts/atlas/signing-key-registry-v1.schema.json
  atlas_activation_contract: contracts/atlas/argus-activation-v1.json
  atlas_synchronization_compatibility: contracts/atlas/synchronization-compatibility.yaml
  atlas_synchronization_receipt_schema: schemas/atlas-argus-sync-receipt.schema.json
  synchronization_runtime: tools/atlas_sync.py
  analysis_runtime: tools/argus_runtime.py

scope:
  primary: ATLAS-governed structured intelligence collection
  principle: Collection depth follows evidence need; analysis and decision remain in ATLAS.
  specializations:
    - government_public_sector_opportunity_intelligence
    - target_intelligence
    - procurement_intelligence
    - supplier_competitor_collection
    - stakeholder_collection
    - installed_base_collection
    - market_landscape_collection
    - monitoring_collection
  access_asia_principle: Access Asia shall not wait for a tender to define an opportunity.

production_runtime:
  access_asia:
    governance_backbone: ATLAS OS
    atlas_change_required: true
    standalone_argus: false
  standalone_mode:
    permitted_for: [portability, testing, recovery, non_access_asia_implementation]

atlas_compatibility:
  validated_against: 2.0.1
  validated_against_commit: b8b8559c57eef5fbb97d914d924077ba20b1883d
  control_revision: chatgpt-bootstrap-2026-10-19-r4
  relationship: nested_intelligence_collection_subsystem
  rule: ATLAS owns Mission Control, Control Plane, collection-need routing, canonical taxonomy, planning, analysis, decisions, assurance, persistence, observability, Dashboard and delivery. ARGUS owns only the authorized intelligence collection mission and returned collection package.
  atlas_domain_context_contract_version: 1.2.0
  atlas_domain_context_contract_path: contracts/atlas/domain-context-handoff-v1.schema.json
  atlas_execution_lease_contract_version: 1.0.0
  atlas_execution_lease_contract_path: contracts/atlas/execution-lease-v1.schema.json
  atlas_signing_key_registry_contract_version: 1.0.0
  atlas_signing_key_registry_contract_path: contracts/atlas/signing-key-registry-v1.schema.json
  handoff_required_in_access_asia_production: true
  execution_lease_required_in_access_asia_production: true
  accepted_handoff_states: [READY, PARTIAL]
  partial_handoff_semantics: ARGUS_ENRICHES_COLLECTION_CONTEXT
  blocked_handoff_execution: prohibited
  exact_return_correlation_required: true
  replay_and_stale_result_protection: enforced
  retry_resume_reconciliation: enforced
  action_authorization_binding: enforced
  atlas_control_record_authenticity: detached_ed25519_lifecycle_governed_key_registry
  activation_contract_version: 3.0.0
  activation_authority: ATLAS_OS
  activation_collection_modes: [ARGUS_COLLECTION, HYBRID]
  activation_capability: intelligence_collection
  keyword_activation: false
  background_activation: false
  creates_execution_spine: false
  owns_planning: false
  owns_approvals: false
  owns_analysis_and_decision: false

operating_loop:
  - Contextualize
  - Resolve_Targets
  - Plan_Collection
  - Discover
  - Acquire
  - Extract
  - Normalize
  - Resolve_Entities
  - Deduplicate
  - Classify
  - Corroborate
  - Detect_Conflicts
  - Assess_Coverage
  - Package
  - Learn

360_intelligence_collection:
  doctrine: 360_degree_breadth_decision_driven_depth
  breadth: all_materially_relevant_lenses
  depth: decision_driven_by_research_frontier
  exhaustive_collection_required: false
  single_source_dependence_prohibited_when_material: true
  lenses: [need_mission, policy_strategy, institution_stakeholders, programme_project, budget_funding, procurement_acquisition, technical_installed_base, supplier_competitor, ecosystem_influence, commercial_participation, timing_triggers, internal_intelligence]
  coverage_states: [NOT_APPLICABLE, UNASSESSED, INSUFFICIENT, PARTIAL, ADEQUATE]
  stopping_rule: stop when additional collection is unlikely to change collection sufficiency, material uncertainty or the next ATLAS action

bangladesh_standardization:
  canonical_data_standard: profiles/bangladesh-data-standard.yaml
  canonical_procurement_extension: profiles/bangladesh-canonical-procurement-standard-v1.3.yaml
  source_mappings: profiles/bangladesh-source-mappings.yaml
  extended_source_mappings: profiles/bangladesh-source-mappings-v1.3.yaml
  institution_standard: profiles/bangladesh-institution-standard.yaml
  pursuit_activation: profiles/bangladesh-pursuit-activation.yaml
  observation_schema: schemas/bangladesh-observation-v1.1.schema.json
  bangladesh_data_standard_version: 1.3.0
  bangladesh_procurement_standard_version: 1.3.0
  rule: Source-specific Bangladesh and development-partner labels normalize into one composed canonical field vocabulary before reconciliation and collection packaging.

pursuit_activation:
  modes: [EARLY_REQUIREMENT_DEVELOPMENT, PLANNED_PROCUREMENT_CAPTURE, LIVE_TENDER_RESPONSE]
  identity_rule: stage changes commercial action, not underlying opportunity identity
  supplier_engagement_can_begin_before_tender: true
  current_bangladesh_framework: PPR 2025

master_registry:
  record_types: [ENTITY, PROJECT, PROCUREMENT, INTELLIGENCE, OPPORTUNITY, SUPPLIER_PRODUCT, KNOWLEDGE]
  logical_canonical_store: ARGUS Master Registry
  physical_canonical_store: github
  canonical_structured_path: data/registry
  synthesized_intelligence_path: data/syntheses
  derived_export_path: data/exports
  database_artifact_path: registry
  preferred_canonical_format: json_or_jsonl
  raw_tender_documents_in_github: prohibited
  raw_source_documents_in_github: prohibited
  original_email_payloads_in_github: prohibited
  operational_database_runtime: deferred
  new_record_type_for_collection: false

canonical_baseline:
  id: ARGUS-GITHUB-CANONICAL-BASELINE-001
  effective_date: 2026-10-18
  record_file: data/registry/records.jsonl
  provenance_file: data/registry/baseline.json
  record_count: 11
  records_sha256: a43cb9555f3c82a827d16508d4e3af9764f4445e99df44853895eb2d505bbc31
  imported_from: ARGUS-DTIF-MIGRATION-PILOT-001 v0.1.0

repository_storage_policy:
  architecture: docs/architecture/github-first-canonical-store.md
  primary_structured_format: JSON_JSONL
  source_bytes_policy: reference_do_not_duplicate
  secrets_in_repository: prohibited

maturity_scope: ACCESS_ASIA_PUBLIC_SECTOR_SPECIALIZATION_ONLY
maturity:
  scale:
    I0: Signal
    I1: Hypothesis
    I2: Validated Need
    I3: Institutional Path
    I4: Delivery/Funding Path
    I5: Actionable Context
    I6: Procurement Planning
    I7: Pre-Procurement
    I8: Procurement Imminent
    I9: Live

evidence:
  claim_types: [FACT, DERIVED, INFERENCE, ASSUMPTION, UNKNOWN]
  claim_conditions: [CURRENT, STALE, CONFLICT]
  atlas_assurance_is_independent: true

decision_scope: ACCESS_ASIA_PUBLIC_SECTOR_SPECIALIZATION_ONLY
decisions: [MONITOR, INVESTIGATE, PROMOTE_TO_PX, MERGE_EXISTING, HOLD, REJECT]

domain_result:
  generic_contract: schemas/intelligence-collection-package.schema.json
  specialization_compatibility_contract: schemas/domain-result.schema.json
  final_user_output_owner: ATLAS OS
  may_report_collection_coverage: true
  may_report_collection_gaps: true
  may_make_final_business_decision: false

release_gates:
  - ATLAS collection-need and ARGUS collection activation contract: PASS
  - ARGUS does not own Mission Control, Control Plane, analysis, decisions, assurance, Dashboard or delivery: PASS
  - generic collection mission and package schemas: PASS
  - public-sector opportunity semantics remain specialization-only: PASS
  - collection coverage remains representable without a new canonical record type: PASS
  - GitHub-first canonical storage policy remains defined: PASS
  - operational database deployment for current phase: DEFERRED_NOT_REQUIRED
