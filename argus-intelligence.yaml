schema_version: 1
product:
  id: argus-intelligence
  name: ARGUS Intelligence
  version: 2.0.0-rc.2
  release_channel: candidate
  status: CANDIDATE
  classification: internal

authority:
  manifest: argus-intelligence.yaml
  core: spec/core.md
  atlas_alignment: alignments/atlas-os.md
  country_profiles:
    bangladesh: profiles/bangladesh.md
  bangladesh_data_standard: profiles/bangladesh-data-standard.yaml
  bangladesh_source_mappings: profiles/bangladesh-source-mappings.yaml
  bangladesh_observation_schema: schemas/bangladesh-observation.schema.json
  domain_result_schema: schemas/domain-result.schema.json
  atlas_domain_context_contract: contracts/atlas/domain-context-handoff-v1.schema.json

scope:
  primary: pre-bid government and public-sector opportunity intelligence
  principle: Access Asia shall not wait for a tender to define an opportunity.

production_runtime:
  access_asia:
    governance_backbone: ATLAS OS
    atlas_change_required: false
    standalone_argus: false
  standalone_mode:
    permitted_for:
      - portability
      - testing
      - recovery
      - non_access_asia_implementation

atlas_compatibility:
  validated_against: 2.0.0-rc.7
  relationship: nested_domain_method
  rule: ARGUS consumes ATLAS-owned domain classification and framework alignment through the governed domain-context handoff and does not redefine them.
  atlas_domain_context_contract_version: 1.0.0
  atlas_domain_context_contract_path: contracts/atlas/domain-context-handoff-v1.schema.json
  handoff_required_in_access_asia_production: true
  accepted_handoff_states:
    - READY
    - PARTIAL
  blocked_handoff_execution: prohibited
  exact_return_correlation_required: true

operating_loop:
  - Contextualize
  - Discover
  - Extract
  - Resolve
  - Reconcile
  - Validate
  - Assess
  - Prioritize
  - Decide
  - Promote_or_Monitor
  - Learn

bangladesh_standardization:
  canonical_data_standard: profiles/bangladesh-data-standard.yaml
  source_mappings: profiles/bangladesh-source-mappings.yaml
  observation_schema: schemas/bangladesh-observation.schema.json
  rule: Source-specific Bangladesh labels normalize into one canonical field vocabulary before route, reconciliation, maturity or commercial assessment.
  preserve_raw_labels_and_values: true
  sparse_observations_allowed: true
  fabricate_missing_fields: false
  source_observation_is_registry_record_type: false
  atlas_domain_context_precedes_argus_normalization: true

360_intelligence_collection:
  doctrine: 360_degree_breadth_decision_driven_depth
  breadth: all_materially_relevant_lenses
  depth: decision_driven_by_research_frontier
  exhaustive_collection_required: false
  single_source_dependence_prohibited_when_material: true
  lenses:
    - need_mission
    - policy_strategy
    - institution_stakeholders
    - programme_project
    - budget_funding
    - procurement_acquisition
    - technical_installed_base
    - supplier_competitor
    - ecosystem_influence
    - commercial_participation
    - timing_triggers
    - internal_intelligence
  coverage_states:
    - NOT_APPLICABLE
    - UNASSESSED
    - INSUFFICIENT
    - PARTIAL
    - ADEQUATE
  convergence:
    distinguish_source_count_from_independent_lineages: true
    copied_or_derivative_sources_do_not_add_independent_confirmation: true
  stopping_rule: stop when additional collection is unlikely to change the domain decision or next action

master_registry:
  record_types:
    - ENTITY
    - PROJECT
    - PROCUREMENT
    - INTELLIGENCE
    - OPPORTUNITY
    - SUPPLIER_PRODUCT
    - KNOWLEDGE
  logical_canonical_store: ARGUS Master Registry
  physical_canonical_store: github
  canonical_structured_path: data/registry
  synthesized_intelligence_path: data/syntheses
  derived_export_path: data/exports
  database_artifact_path: registry
  preferred_canonical_format: json_or_jsonl
  allowed_supporting_formats:
    - markdown
    - csv
    - xlsx_for_review_or_interchange
    - yaml
    - sql_for_database_artifacts
  raw_tender_documents_in_github: prohibited
  raw_source_documents_in_github: prohibited
  original_email_payloads_in_github: prohibited
  operational_database_runtime: deferred
  future_database_materialization_must_preserve_argus_semantics: true
  new_record_type_for_collection: false

canonical_baseline:
  id: ARGUS-GITHUB-CANONICAL-BASELINE-001
  effective_date: 2026-10-18
  record_file: data/registry/records.jsonl
  provenance_file: data/registry/baseline.json
  record_count: 11
  records_sha256: a43cb9555f3c82a827d16508d4e3af9764f4445e99df44853895eb2d505bbc31
  imported_from: ARGUS-DTIF-MIGRATION-PILOT-001 v0.1.0
  source_fixture_sha256: 2cfb99c9045eb8bf2739f39db3591b618307bda4b3cc1b301461bb259e50f2b9
  fresh_database_export: false
  raw_tender_documents_imported: false
  canonical_lineage_rule: governed Git commits and PRs define current structured lineage for this phase

registry_compatibility:
  validated_against_contract: ARGUS-REG-001 v0.2.0
  validated_against_schema: ARGUS-SCHEMA-REG-001 v0.2.0
  validated_schema_sha256: 2dad9c73dc0236395fe0418f6694ee53b478ccc51c86996d8bc00abff5f2f808
  historical_api_baseline: Registry API v0.1.1
  bangladesh_route_fields: PASS_ADDITIVE_ATTRIBUTES
  collection_coverage: PASS_ADDITIVE_ATTRIBUTES
  collection_gaps: PASS_ADDITIVE_ATTRIBUTES
  source_convergence: PASS_ADDITIVE_ATTRIBUTES
  evidence_claim_type_condition_split: CANDIDATE_CONTRACT_PASS
  candidate_registry_schema: registry/schema/argus-master-registry-v0.2.1.json
  candidate_registry_contract: registry/contract/master-registry-v0.2.1.md
  candidate_physical_migration: registry/migrations/0.2.0-to-0.2.1-evidence.sql
  operational_database_deployment_required_for_current_phase: false
  database_materialization_work: deferred_until_runtime_need
  validation_record: docs/validation/registry-schema-compatibility-rc2.md

bangladesh_lifecycle_validation:
  status: PASS
  app_tender_amendment_award_reconciliation: PASS
  defence_preproc_evaluation_standardization: PASS
  cross_fiscal_adp_radp_lineage: PASS
  promotion_before_live_tender: PASS
  validation_record: docs/validation/bangladesh-lifecycle-release-gates-rc2.md
  live_registry_mutation: false

canonical_ownership:
  structured_intelligence: GitHub private repository data/registry under ARGUS Master Registry semantics
  synthesized_intelligence: GitHub private repository data/syntheses
  communications: communication system; GitHub stores references/syntheses only
  original_documents: external document repository/source system; GitHub stores references/syntheses only
  post_px_commercial_pursuit: CRM when activated; GitHub preserves ARGUS canonical identity and synthesis
  framework_governance_database_artifacts: GitHub private repository

repository_storage_policy:
  architecture: docs/architecture/github-first-canonical-store.md
  primary_structured_format: JSON_JSONL
  csv_role: derived_interchange_or_review
  xlsx_role: derived_human_review_or_interchange_not_preferred_canonical
  markdown_role: synthesized_intelligence_governance_and_decisions
  source_bytes_policy: reference_do_not_duplicate
  secrets_in_repository: prohibited

maturity:
  scale:
    I0: Signal
    I1: Hypothesis
    I2: Validated Need
    I3: Institutional Path
    I4: Delivery/Funding Path
    I5: Actionable Context
    I6: Procurement Planning
    I7: Pre-Procurement
    I8: Procurement Imminent
    I9: Live
  independent_dimensions:
    - project_state
    - funding_state
    - procurement_state
    - evidence_confidence
    - commercial_attractiveness
    - procurement_horizon
    - strategic_fit
    - blockers_and_unknowns
    - collection_coverage

evidence:
  claim_types:
    - FACT
    - DERIVED
    - INFERENCE
    - ASSUMPTION
    - UNKNOWN
  claim_conditions:
    - CURRENT
    - STALE
    - CONFLICT
  atlas_assurance_is_independent: true

decisions:
  - MONITOR
  - INVESTIGATE
  - PROMOTE_TO_PX
  - MERGE_EXISTING
  - HOLD
  - REJECT

domain_result:
  contract: schemas/domain-result.schema.json
  final_user_output_owner: ATLAS OS
  may_propose_domain_actions: true
  may_report_collection_coverage: true
  may_report_collection_gaps: true
  atlas_governed_results_must_return_upstream_handoff_receipt: true

release_gates:
  - Registry route/profile fields remain portable under ARGUS record contract: PASS
  - collection coverage can be represented without creating a new canonical record type: PASS
  - representative Bangladesh route compatibility tests pass: PASS
  - claim type and claim condition candidate schema contract: PASS
  - GitHub-first canonical storage policy is defined and testable: PASS
  - initial GitHub structured canonical baseline is committed and integrity-tested: PASS
  - operational database deployment for current phase: DEFERRED_NOT_REQUIRED
  - 360-degree collection contract test passes: PASS
  - APP/tender/amendment/award reconciliation avoids duplicate opportunities: PASS
  - defence pre-procurement signal test passes: PASS
  - cross-fiscal-year project lineage test passes: PASS
  - promotion-before-live-tender test passes: PASS
  - ATLAS domain-context handoff pin and return-correlation contract: PASS
  - Bangladesh cross-source canonical data standard and observation contract: PASS
