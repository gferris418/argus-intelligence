version: 1.0.0
status: CANDIDATE
atlas_contract: atlas.canonical-execution-graph/1.0.0
purpose: >-
  Project the existing normative ARGUS startup sequence and collection method onto a
  versioned, hierarchically numbered execution graph without changing ARGUS doctrine.
  ATLAS governs structural integrity and activation; ARGUS owns the declared BI stages.

runtime_policy:
  invent_canonical_nodes: PROHIBITED
  extension_route: ATLAS_GOVERNED_VERSION_CHANGE
  silent_omission: PROHIBITED
  unknown_result_is_valid_when_evidence_insufficient: true

